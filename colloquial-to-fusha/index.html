 var t=toks[+m.getAttribute("data-ix")];
 if(t&&t.alts&&t.alts.length>1){t.sel=(t.sel+1)%t.alts.length;render();}
});
function applyLang(){
 var t=T[L];var vf=$("vidFrame");if(vf&&VID.en){var vs="https://www.youtube-nocookie.com/embed/"+(L==="ar"?VID.ar:VID.en)+"?rel=0";if(vf.getAttribute("src")!==vs)vf.setAttribute("src",vs);}document.documentElement.lang=L;document.documentElement.dir=t.dir;
 $("foot").innerHTML=t.foot;$("langBtn").textContent=t.btn;
 var a=document.querySelectorAll("[data-i]");for(var i=0;i<a.length;i++)a[i].textContent=t[a[i].getAttribute("data-i")];
 var h=document.querySelectorAll("[data-h]");for(var j=0;j<h.length;j++)h[j].textContent=t[h[j].getAttribute("data-h")];
 var p=document.querySelectorAll("[data-p]");for(var q=0;q<p.length;q++)p[q].setAttribute("placeholder",t[p[q].getAttribute("data-p")]);
 document.title=L==="ar"?"تحويل العامية المصرية إلى الفصحى | Sayvoi":"Egyptian Arabic to Standard Arabic Converter | Sayvoi";
}
$("go").addEventListener("click",run);
$("ex").addEventListener("click",function(){$("ta").value=EX;run();});
$("clr").addEventListener("click",function(){$("ta").value="";$("res").style.display="none";$("msg").style.display="none";toks=[];});
$("copy").addEventListener("click",function(){
 var v=plain();if(!v)return;
 var done=function(){show(T[L].copied,false);};
 try{navigator.clipboard.writeText(v).then(done,function(){});}catch(e){var x=document.createElement("textarea");x.value=v;document.body.appendChild(x);x.select();try{document.execCommand("copy");done();}catch(e2){}document.body.removeChild(x);}
});
$("sv").addEventListener("click",function(){
 try{localStorage.setItem(MYKEY,$("my").value);}catch(e){}
 loadMy();show(T[L].saved,false);if($("res").style.display==="block"&&$("ta").value.trim()){toks=conv($("ta").value);render();}
});
$("exp").addEventListener("click",function(){
 var u=URL.createObjectURL(new Blob([$("my").value],{type:"text/plain;charset=utf-8"})),a=document.createElement("a");
 a.href=u;a.download="my-words.txt";document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(u);},1000);
});
$("imp").addEventListener("click",function(){$("fileI").click();});
$("fileI").addEventListener("change",function(){
 var f=this.files[0];this.value="";if(!f)return;
 var fr=new FileReader();fr.onload=function(){var v=$("my").value;$("my").value=(v?v.replace(/\n*$/,"\n"):"")+String(fr.result||"");};fr.readAsText(f,"UTF-8");
});
$("langBtn").addEventListener("click",function(){L=L==="en"?"ar":"en";try{localStorage.setItem("sayvoi_lang",L);}catch(e){}applyLang();if(toks.length)render();});
loadMy();applyLang();
})();
</script>
