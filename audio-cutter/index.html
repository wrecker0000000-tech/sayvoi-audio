 gn.gain.setValueAtTime(f[0]>0?0:1,t0); if(f[0]>0) gn.gain.linearRampToValueAtTime(1,t0+f[0]);
 if(f[1]>0){ gn.gain.setValueAtTime(1,t0+len-f[1]); gn.gain.linearRampToValueAtTime(0,t0+len); }
 s.connect(gn); gn.connect(ctx.destination); s.start(t0,st,len); src=s; playing=true; playT0=t0;
 s.onended=function(){ if(src===s){ stopPlay(); } };
 $("play").textContent=T[L].stop;
 (function tick(){ if(!playing) return; var p=st+Math.max(0,ctx.currentTime-playT0); draw(Math.min(p,en)); raf=requestAnimationFrame(tick); })();
}
$("play").addEventListener("click",function(){ if(!buf) return; if(playing) stopPlay(); else startPlay(); });

/* ---------- export ---------- */
function render(){
 var sr=buf.sampleRate, s0=Math.floor(st*sr), s1=Math.min(buf.length,Math.floor(en*sr)), n=s1-s0, nc=Math.min(2,buf.numberOfChannels), out=[], f=fades(n/sr);
 var fi=Math.min(n,Math.floor(f[0]*sr)), fo=Math.min(n,Math.floor(f[1]*sr));
 for(var c=0;c<nc;c++){ var o=new Float32Array(n); o.set(buf.getChannelData(c).subarray(s0,s1));
  for(var i=0;i<fi;i++) o[i]*=i/fi; for(var j=0;j<fo;j++) o[n-1-j]*=j/fo; out.push(o); }
 return {ch:out,sr:sr,n:n};
}
function toWav(r){
 var nc=r.ch.length, n=r.n, bytes=44+n*nc*2, ab=new ArrayBuffer(bytes), v=new DataView(ab);
 function ws(o,s){ for(var i=0;i<s.length;i++) v.setUint8(o+i,s.charCodeAt(i)); }
 ws(0,"RIFF"); v.setUint32(4,bytes-8,true); ws(8,"WAVE"); ws(12,"fmt "); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,nc,true);
 v.setUint32(24,r.sr,true); v.setUint32(28,r.sr*nc*2,true); v.setUint16(32,nc*2,true); v.setUint16(34,16,true); ws(36,"data"); v.setUint32(40,n*nc*2,true);
 var p=44; for(var i=0;i<n;i++) for(var c=0;c<nc;c++){ var x=Math.max(-1,Math.min(1,r.ch[c][i])); v.setInt16(p,x<0?x*32768:x*32767,true); p+=2; }
 return new Blob([ab],{type:"audio/wav"});
}
function i16(a){ var o=new Int16Array(a.length); for(var i=0;i<a.length;i++){ var x=Math.max(-1,Math.min(1,a[i])); o[i]=x<0?x*32768:x*32767; } return o; }
function loadLame(){
 if(window.lamejs) return Promise.resolve();
 if(lameLoading) return lameLoading;
 lameLoading=new Promise(function(res,rej){ var s=document.createElement("script"); s.src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"; s.onload=function(){ window.lamejs?res():rej(); }; s.onerror=function(){ lameLoading=null; rej(); }; document.head.appendChild(s); });
 return lameLoading;
}
function toMp3(r,kbps){
 var nc=r.ch.length, enc=new window.lamejs.Mp3Encoder(nc,r.sr,kbps), L16=i16(r.ch[0]), R16=nc>1?i16(r.ch[1]):null, parts=[], B=1152;
 for(var i=0;i<r.n;i+=B){ var a=L16.subarray(i,i+B), d=nc>1?enc.encodeBuffer(a,R16.subarray(i,i+B)):enc.encodeBuffer(a); if(d.length) parts.push(new Uint8Array(d)); }
 var e=enc.flush(); if(e.length) parts.push(new Uint8Array(e));
 return new Blob(parts,{type:"audio/mpeg"});
}
function download(blob,ext){
 var url=URL.createObjectURL(blob), a=document.createElement("a"), name=fileName+"-cut."+ext;
 a.href=url; a.download=name; document.body.appendChild(a); a.click(); document.body.removeChild(a);
 var r=$("result"); r.textContent=T[L].done+name+" ("+(blob.size/1048576).toFixed(2)+" MB)"; r.style.display="block";
 setTimeout(function(){ URL.revokeObjectURL(url); },60000);
}
$("fmt").addEventListener("change",function(){ $("brCol").style.display=this.value==="mp3"?"":"none"; });
$("save").addEventListener("click",function(){
 if(!buf) return; if(en-st<0.1){ $("status").textContent=T[L].tooShort; return; }
 stopPlay(); warn(""); $("status").textContent=T[L].exporting; $("result").style.display="none"; var btn=this; btn.disabled=true;
 setTimeout(function(){
  try{
   var r=render();
   if($("fmt").value==="wav"){ download(toWav(r),"wav"); $("status").textContent=""; btn.disabled=false; }
   else loadLame().then(function(){ download(toMp3(r,+$("br").value),"mp3"); $("status").textContent=""; btn.disabled=false; })
     .catch(function(){ $("status").textContent=""; warn(T[L].mp3Err); btn.disabled=false; });
  }catch(e){ $("status").textContent=""; warn(T[L].decodeErr); btn.disabled=false; }
 },30);
});
$("langBtn").addEventListener("click",function(){ L=L==="en"?"ar":"en"; try{ localStorage.setItem("sayvoi_lang",L); }catch(e){} applyLang(); });
applyLang();
})();
