function mediaDur(file){

 $("nav").innerHTML=t.nav;$("foot").innerHTML=t.foot;$("langBtn").textContent=t.btn;
 var a=document.querySelectorAll("[data-i]");for(var i=0;i<a.length;i++){var k=a[i].getAttribute("data-i");if(k==="beta")a[i].innerHTML=t[k];else a[i].textContent=t[k];}
 var h=document.querySelectorAll("[data-h]");for(var j=0;j<h.length;j++)h[j].innerHTML=t[h[j].getAttribute("data-h")];
 var o=document.querySelectorAll("option[data-k]");for(var m=0;m<o.length;m++)o[m].textContent=t[o[m].getAttribute("data-k")];
 $("csv").textContent=t.csv;$("copy").textContent=t.copy;$("clr").textContent=t.clr;
 document.title=L==="ar"?"حاسبة مدة الملفات الصوتية | Sayvoi":"Audio Duration Calculator: Total Length of Many Files | Sayvoi";
 render();}

$("drop").addEventListener("click",function(){$("fi").click();});
$("drop").addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();$("fi").click();}});
$("fi").addEventListener("change",function(){addFiles(this.files);this.value="";});
["dragenter","dragover"].forEach(function(n){$("drop").addEventListener(n,function(e){e.preventDefault();this.classList.add("over");});});
["dragleave","drop"].forEach(function(n){$("drop").addEventListener(n,function(e){e.preventDefault();this.classList.remove("over");});});
$("drop").addEventListener("drop",function(e){if(e.dataTransfer&&e.dataTransfer.files)addFiles(e.dataTransfer.files);});
["tmin","tmax","trate","tch","need","only"].forEach(function(i){$(i).addEventListener("input",render);$(i).addEventListener("change",render);});
$("clr").addEventListener("click",function(){gen++;rows=[];$("status").textContent="";$("prog").style.display="none";render();});
$("csv").addEventListener("click",function(){var b=new Blob(["﻿"+csvText(",")],{type:"text/csv;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="durations.csv";document.body.appendChild(a);a.click();document.body.removeChild(a);});
$("copy").addEventListener("click",function(){var v=csvText("\t"),b=this,ok=function(){b.textContent="✓";setTimeout(function(){b.textContent=T[L].copy;},1200);};
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(v).then(ok,function(){});else{var ta=document.createElement("textarea");ta.value=v;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");}catch(e){}document.body.removeChild(ta);ok();}});
document.querySelector("thead").addEventListener("click",function(e){var k=e.target.getAttribute&&e.target.getAttribute("data-s");if(!k)return;if(sortKey===k)sortDir=-sortDir;else{sortKey=k;sortDir=1;}render();});
$("langBtn").addEventListener("click",function(){L=L==="en"?"ar":"en";try{localStorage.setItem("sayvoi_lang",L);}catch(e){}applyLang();});
window.DurCalc={parseHeader:parseHeader};
applyLang();
})();
</script>
