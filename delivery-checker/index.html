function allowed(rule,val){if(rule.list)return rule.list.indexOf(val)>=0;if(/^\d+$/.test(val)){var n=+val;return n>=rule.lo&&n<=rule.hi;}return false;}
function probeWav(ab,size){

  else if(id==="data"){dataStart=p+8;dataSize=sz;break;}
  p+=8+sz+(sz&1);}

 if(!dataStart){dataStart=44;}
 var avail=Math.max(0,size-dataStart);if(!dataSize||dataSize===0xFFFFFFFF||dataSize>avail)dataSize=avail;

 }
 // names
 files.forEach(function(f){
  if(pat){var m=pat.re.exec(f.stem);if(!m){issues.push({t:"name",file:f.name,d:["dName"]});}
   else{f.tokens={};pat.names.forEach(function(k,ix){f.tokens[k]=m[ix+1];});
    pat.names.forEach(function(k){var r=allow[k];if(r&&!allowed(r,f.tokens[k]))issues.push({t:"name",file:f.name,d:["dVal",k,f.tokens[k]]});});}}

 });
