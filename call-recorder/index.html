function saveRemote(pcm,sr){return idbPut("chunks",{sid:sid,kind:"remote",seq:0,rate:sr,buf:pcm.buffer.slice(pcm.byteOffset,pcm.byteOffset+pcm.byteLength)});}
function allMeta(){return new Promise(function(res){if(!db)return res([]);try{var r=db.transaction("meta").objectStore("meta").getAll();r.onsuccess=function(){res((r.result||[]).sort(function(a,b){return b.sid-a.sid;}));};r.onerror=function(){res([]);};}catch(e){res([]);}});}
function chunksOf(id){return new Promise(function(res){if(!db)return res([]);try{var r=db.transaction("chunks").objectStore("chunks").index("sid").getAll(id);r.onsuccess=function(){res(r.result||[]);};r.onerror=function(){res([]);};}catch(e){res([]);}});}
function delSession(id){return new Promise(function(res){if(!db)return res();try{var tx=db.transaction(["meta","chunks"],"readwrite");tx.objectStore("meta").delete(id);var c=tx.objectStore("chunks").index("sid").openKeyCursor(IDBKeyRange.only(id));c.onsuccess=function(){var cur=c.result;if(cur){tx.objectStore("chunks").delete(cur.primaryKey);cur.continue();}};tx.oncomplete=function(){res();};tx.onerror=function(){res();};tx.onabort=function(){res();};}catch(e){res();}});}
function pruneOld(){return allMeta().then(function(m){var p=Promise.resolve();m.slice(5).forEach(function(x){p=p.then(function(){return delSession(x.sid);});});return p;}).then(renderSaved);}
function joinOf(list,kind){var parts=list.filter(function(c){return c.kind===kind;}).sort(function(a,b){return a.seq-b.seq;}),n=0,i;for(i=0;i<parts.length;i++)n+=parts[i].buf.byteLength/2;var out=new Int16Array(n),p=0;for(i=0;i<parts.length;i++){var a=new Int16Array(parts[i].buf);out.set(a,p);p+=a.length;}return {pcm:out,rate:(parts[0]&&parts[0].rate)||0};}
function renderSaved(){var box=$("saved");if(!box)return;allMeta().then(function(m){box.innerHTML="";show("delAll",m.length>0);
 if(!m.length){var e=document.createElement("p");e.className="note";e.textContent=t().sNone;box.appendChild(e);return;}
 m.forEach(function(x){var d=document.createElement("div");d.className="out";var secs=Math.round((x.samples||0)/(x.rate||16000));var dt=new Date(x.sid);
  var b=document.createElement("b");b.textContent=dt.toLocaleString()+" · "+(x.names&&x.names.s||"")+" · "+(x.role==="host"?t().sHost:t().sGuest)+" · "+mmss(secs)+(x.done?"":" ⚠");d.appendChild(b);
  var hold=document.createElement("span");var bp=document.createElement("button");bp.type="button";bp.className="b sec";bp.textContent=t().sPrep;
  bp.addEventListener("click",function(){bp.disabled=true;chunksOf(x.sid).then(function(list){hold.innerHTML="";var o=joinOf(list,"own");
   function link(txt,blob,name){var a=document.createElement("a");a.className="b";a.href=URL.createObjectURL(blob);a.download=name;a.textContent=txt;a.style.marginInlineEnd="8px";hold.appendChild(a);}
   var nm=(x.names&&x.names.s||"call"),who=x.role==="host"?(x.names&&x.names.a||"A"):(x.names&&x.names.b||"B");
   if(o.pcm.length)link(t().sOwn,wavBlob(o.pcm,x.rate,x.ch||1),nm+"_"+who+"_saved.wav");
   var r=joinOf(list,"remote");if(r.pcm.length)link(t().sPart,wavBlob(r.pcm,r.rate,x.ch||1),nm+"_"+(x.role==="host"?(x.names&&x.names.b||"B"):(x.names&&x.names.a||"A"))+"_saved.wav");});});
  var bd=document.createElement("button");bd.type="button";bd.className="b sec";bd.textContent=t().sDel;bd.addEventListener("click",function(){delSession(x.sid).then(renderSaved);});
  d.appendChild(bp);d.appendChild(bd);d.appendChild(hold);box.appendChild(d);});});}
$("delAll").addEventListener("click",function(){allMeta().then(function(m){var p=Promise.resolve();m.forEach(function(x){p=p.then(function(){return delSession(x.sid);});});return p;}).then(renderSaved);});

/* wav */
function wavBlob(pcm,sr,ch){ch=ch||1;var n=pcm.length,h=new ArrayBuffer(44),v=new DataView(h),bytes=n*ch*2;
 function w(o,x){for(var i=0;i<x.length;i++)v.setUint8(o+i,x.charCodeAt(i));}
 w(0,"RIFF");v.setUint32(4,36+bytes,true);w(8,"WAVE");w(12,"fmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,ch,true);v.setUint32(24,sr,true);v.setUint32(28,sr*ch*2,true);v.setUint16(32,ch*2,true);v.setUint16(34,16,true);w(36,"data");v.setUint32(40,bytes,true);
 if(ch===1)return new Blob([h,pcm],{type:"audio/wav"});
 var parts=[h],STEP=1048576;for(var o=0;o<n;o+=STEP){var len=Math.min(STEP,n-o),st=new Int16Array(len*2);for(var i=0;i<len;i++){st[2*i]=pcm[o+i];st[2*i+1]=pcm[o+i];}parts.push(st);}
 return new Blob(parts,{type:"audio/wav"});}
function resample(pcm,from,to){if(from===to)return Promise.resolve(pcm);
 var C=window.OfflineAudioContext||window.webkitOfflineAudioContext,len=Math.ceil(pcm.length*to/from),oc=new C(1,len,to),buf=oc.createBuffer(1,pcm.length,from),ch=buf.getChannelData(0);
 for(var i=0;i<pcm.length;i++)ch[i]=pcm[i]/32768;var s=oc.createBufferSource();s.buffer=buf;s.connect(oc.destination);s.start();
 return new Promise(function(res,rej){var p=oc.startRendering(function(r){});if(p&&p.then)p.then(done,rej);else oc.oncomplete=function(e){done(e.renderedBuffer);};
  function done(rb){var d=rb.getChannelData(0),o=new Int16Array(d.length);for(var i=0;i<d.length;i++){var x=Math.max(-1,Math.min(1,d[i]));o[i]=x<0?x*32768:x*32767;}res(o);}});}

function updEst(){var r=parseInt($("rate").value,10)||16000,c=parseInt($("chn").value,10)||1,mb=Math.round(r*c*2*1800/1048576);var e=$("estN");e.textContent=t().est.replace("%s",mb)+(mb>150?t().estBig:"");}
$("rate").addEventListener("change",updEst);$("chn").addEventListener("change",updEst);
/* messages */
var rx=null;
function onMsg(e){
 if(typeof e.data!=="string"){ if(rx){rx.parts.push(new Int16Array(e.data));rx.got+=e.data.byteLength/2;var pct=Math.round(rx.got/rx.len*100);$("prog").textContent=t().recv+pct+"%";show("prog",true);}return;}
 var m;try{m=JSON.parse(e.data);}catch(x){return;}
 if(m.t==="ping"){try{dc.send(JSON.stringify({t:"pong",ts:m.ts}));}catch(x){}}
 else if(m.t==="pong"){var r=performance.now()-m.ts;rtts.push(r);if(rtts.length>10)rtts.shift();oneWay=median(rtts)/2;$("rttV").textContent=Math.round(median(rtts))+" ms";}
 else if(m.t==="cfg"){rate=m.rate;chn=m.ch||1;names=m.names;cfgGot=true;if(pc&&pc.connectionState==="connected")startLive();}
 else if(m.t==="start"){names=m.names;beginRec();}
 else if(m.t==="stop"){guestFinish();}
 else if(m.t==="file"){rx={len:m.len,rate:m.rate,got:0,parts:[]};}
 else if(m.t==="filedone"){var all=new Int16Array(rx.got),p=0;for(var i=0;i<rx.parts.length;i++){all.set(rx.parts[i],p);p+=rx.parts[i].length;}gotRemote={pcm:all,rate:rx.rate};saveRemote(all,rx.rate).then(renderSaved);rx=null;show("prog",false);if(hostPending)hostBuild();}
 else if(m.t==="nofile"){gotRemote={pcm:new Int16Array(0),rate:rate,none:true};if(hostPending)hostBuild();}
}
function sendFile(pcm,sr){return new Promise(function(res){
 dc.send(JSON.stringify({t:"file",len:pcm.length,rate:sr}));var off=0,STEP=8192;
 function pump(){while(off<pcm.length){if(dc.bufferedAmount>1048576){dc.onbufferedamountlow=function(){dc.onbufferedamountlow=null;pump();};return;}
  var part=pcm.subarray(off,Math.min(pcm.length,off+STEP));dc.send(part.buffer.slice(part.byteOffset,part.byteOffset+part.byteLength));off+=STEP;
  var pct=Math.round(Math.min(off,pcm.length)/pcm.length*100);$("prog").textContent=t().prep+" "+pct+"%";}
  dc.send(JSON.stringify({t:"filedone"}));res();}
 pump();});}

/* host */
var hostPending=false,hostPcm=null,hostRate=16000;
$("recBtn").addEventListener("click",function(){
 if(role!=="host")return;
 if(!recording){names=cfgObj().names;
  try{dc.send(JSON.stringify({t:"start",rate:rate,names:names}));}catch(e){return;}
  beginRec();}
 else{try{dc.send(JSON.stringify({t:"stop"}));}catch(e){}
  hostPcm=endRec();hostRate=myRate;hostPending=true;gotRemote=null;$("recBtn").disabled=true;
  $("prog").textContent=t().prep;show("prog",true);
  setTimeout(function(){if(hostPending&&!gotRemote){/* wait more */}},1000);}});
function hostBuild(){
 hostPending=false;$("recBtn").disabled=false;$("recBtn").textContent=t().rec;show("prog",false);
 var g=gotRemote,delay=Math.round(oneWay),ch=chn;
 resample(hostPcm,hostRate,rate).then(function(A){
  return resample(g.pcm,g.rate,rate).then(function(B0){return {A:A,B0:B0};});
 }).then(function(r){
  var A=r.A,B0=r.B0,pad=g.none?0:Math.round(delay/1000*rate),N=Math.max(A.length,pad+B0.length),i;
  var A2=A;if(A.length<N){A2=new Int16Array(N);A2.set(A);}
  var files=[{n:names.s+"_"+names.a+".wav",l:t().fA,b:wavBlob(A2,rate,ch)}];
  if(!g.none){
   var B2=new Int16Array(N);B2.set(B0,pad);r.B0=null;g.pcm=null;
   files.push({n:names.s+"_"+names.b+".wav",l:t().fB,b:wavBlob(B2,rate,ch)});
   var mx=0;for(i=0;i<N;i++){var s=Math.abs(A2[i]+B2[i]);if(s>mx)mx=s;}var k=mx>32000?32000/mx:1,M=new Int16Array(N);
   for(i=0;i<N;i++)M[i]=Math.round((A2[i]+B2[i])*k);B2=null;
   files.push({n:names.s+"_mix.wav",l:t().fMix,b:wavBlob(M,rate,ch)});M=null;}
  hostPcm=null;A2=null;
  showOuts(files);
  var im=$("infoN");im.textContent=g.none?t().noGuest:t().info.replace("%s",delay);show("infoN",true);
 }).catch(function(){setSt(t().stFail,"bad");});}
function showOuts(files){var box=$("outs");box.innerHTML="";show("resCard",true);
 files.forEach(function(f){var d=document.createElement("div");d.className="out";var u=URL.createObjectURL(f.b);f.u=u;
  d.innerHTML='<b></b><audio controls preload="none"></audio><a class="b" download></a>';d.querySelector("b").textContent=f.l+" — "+f.n;d.querySelector("audio").src=u;var a=d.querySelector("a");a.href=u;a.download=f.n;a.textContent=t().dl;box.appendChild(d);});
 if(files.length>1&&window.JSZip){var holder=document.createElement("div");holder.className="out";holder.innerHTML='<b></b><button type="button" class="b sec"></button>';holder.querySelector("b").textContent=names.s+".zip";var zb=holder.querySelector("button");zb.textContent=t().zipB;box.appendChild(holder);
  zb.addEventListener("click",function(){zb.disabled=true;holder.querySelector("b").textContent=t().zipMk;var z=new JSZip();files.forEach(function(f){z.file(f.n,f.b);});
   z.generateAsync({type:"blob",compression:"STORE"}).then(function(zbl){var u=URL.createObjectURL(zbl);holder.innerHTML='<b></b><a class="b"></a>';holder.querySelector("b").textContent=names.s+".zip";var a=holder.querySelector("a");a.href=u;a.download=names.s+".zip";a.textContent=t().zip;});});}}

/* guest */
function guestFinish(){var pcm=endRec();var x=t();$("prog").textContent=x.prep;show("prog",true);
 var mine=wavBlob(pcm,myRate,chn);var mb=$("mineBox");mb.innerHTML="";var p=document.createElement("p");p.textContent=x.mine;mb.appendChild(p);var a=document.createElement("a");a.className="b";a.href=URL.createObjectURL(mine);a.download=(names.s||"call")+"_"+(names.b||"B")+".wav";a.textContent=x.dl;mb.appendChild(a);show("mineBox",true);show("resCard",true);
 $("gNote").textContent=t().guestWait;
 sendFile(pcm,myRate).then(function(){show("prog",false);var s=document.createElement("p");s.textContent=t().sentOk;mb.appendChild(s);});}

openDb().then(function(){renderSaved();});applyLang();updEst();
})();
