var $=function(i){return document.getElementById(i);};
var L="en";try{if(localStorage.getItem("sayvoi_lang")==="ar")L="ar";}catch(e){}
var role=null,stream=null,pc=null,dc=null,remote=null,actx=null,proc=null,srcN=null,anMe=null,anThem=null,rate=16000;
var cfgGot=false,recording=false,chunks=[],recStart=0,tickT=null,rtts=[],pingT=null,oneWay=0,names={a:"A",b:"B",s:"call01"},gotRemote=null,myRate=16000,peak=0,wl=null;
function t(){return T[L];}
function show(id,on){$(id).classList[on?"remove":"add"]("hide");}
function clean(s,d){s=String(s||"").replace(/[^A-Za-z0-9_\-؀-ۿ]/g,"_").replace(/^_+|_+$/g,"");return s||d;}
function b64e(s){return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");}
function b64d(s){s=s.replace(/\s+/g,"").replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";return decodeURIComponent(escape(atob(s)));}
function pack(desc){return "SVC1."+b64e(JSON.stringify({s:desc.sdp,y:desc.type}));}
function unpack(code){code=String(code||"").replace(/\s+/g,"");if(code.indexOf("SVC1.")!==0)throw new Error("bad");var o=JSON.parse(b64d(code.slice(5)));if(!o.s||!o.y)throw new Error("bad");return {type:o.y,sdp:o.s};}
function setSt(msg,cls){var b=$("st");b.textContent=msg;b.className="box"+(cls?" "+cls:"");}
function mmss(s){s=Math.floor(s);var m=Math.floor(s/60),r=s%60;return (m<10?"0":"")+m+":"+(r<10?"0":"")+r;}
function applyLang(){var x=t();document.documentElement.lang=L;document.documentElement.dir=x.dir;
 $("nav").innerHTML=x.nav;$("foot").innerHTML=x.foot;$("langBtn").textContent=x.btn;
 var a=document.querySelectorAll("[data-i]");for(var i=0;i<a.length;i++)a[i].textContent=x[a[i].getAttribute("data-i")];
 var h=document.querySelectorAll("[data-h]");for(var j=0;j<h.length;j++)h[j].innerHTML=x[h[j].getAttribute("data-h")];
 $("mic").textContent=x.mic;$("mkOffer").textContent=x.mkOffer;$("copyOffer").textContent=x.copy;$("connect").textContent=x.connect;$("mkAns").textContent=x.mkAns;$("copyAns").textContent=x.copy;
 $("recBtn").textContent=recording?x.stopB:x.rec;$("gNote").textContent=x.guestWait;
 document.title="Call Recorder | Sayvoi";
 if(!pc)setSt(x.st0);}

/* role */
function pickRole(r){role=r;$("rHost").classList.toggle("on",r==="host");$("rGuest").classList.toggle("on",r==="guest");
 show("setCard",r==="host");show("connCard",true);show("hostFlow",r==="host");show("guestFlow",r==="guest");}
$("rHost").addEventListener("click",function(){pickRole("host");});
$("rGuest").addEventListener("click",function(){pickRole("guest");});

/* microphone */
$("mic").addEventListener("click",function(){
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||(location.protocol!=="https:"&&location.hostname!=="localhost")){setSt(t().errHttps,"bad");return;}
 navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false,channelCount:1}}).then(function(s){
  stream=s;$("mic").disabled=true;var b=$("micBox");b.textContent=t().micOk;b.className="box ok";show("micBox",true);
  $("mkOffer").disabled=false;$("mkAns").disabled=false;
 }).catch(function(){setSt(t().errMic,"bad");});});

/* webrtc */
var CFG={iceServers:[{urls:"stun:stun.l.google.com:19302"}]};
function waitGather(p){return new Promise(function(res){if(p.iceGatheringState==="complete")return res();var d=false;function fin(){if(!d){d=true;res();}}
 p.addEventListener("icegatheringstatechange",function(){if(p.iceGatheringState==="complete")fin();});setTimeout(fin,4000);});}
function setupPC(){
 pc=new RTCPeerConnection(CFG);
 stream.getTracks().forEach(function(tr){pc.addTrack(tr,stream);});
 pc.ontrack=function(e){remote=e.streams[0];var au=$("rau");if(!au){au=document.createElement("audio");au.id="rau";au.autoplay=true;au.setAttribute("playsinline","");document.body.appendChild(au);}au.srcObject=remote;var p=au.play();if(p&&p.catch)p.catch(function(){});};
 pc.onconnectionstatechange=function(){var s=pc.connectionState;
  if(s==="connected"){setSt(t().stOk,"ok");if(role==="host"||cfgGot)startLive();}
  else if(s==="failed"){setSt(t().stFail,"bad");}
  else if(s==="connecting")setSt(t().stWait);};
 pc.oniceconnectionstatechange=function(){if(pc.iceConnectionState==="failed")setSt(t().stFail,"bad");};
}
function wireDC(ch){dc=ch;dc.binaryType="arraybuffer";dc.bufferedAmountLowThreshold=262144;
 dc.onmessage=onMsg;dc.onopen=function(){if(role==="host"){try{dc.send(JSON.stringify(cfgObj()));}catch(e){}pingT=setInterval(function(){try{dc.send(JSON.stringify({t:"ping",ts:performance.now()}));}catch(e){}},1000);}};}
$("mkOffer").addEventListener("click",function(){
 $("mkOffer").disabled=true;setupPC();wireDC(pc.createDataChannel("ctl"));
 pc.createOffer().then(function(o){return pc.setLocalDescription(o);}).then(function(){return waitGather(pc);}).then(function(){
  $("offerOut").value=pack(pc.localDescription);show("offerWrap",true);setSt(t().stWait);}).catch(function(){setSt(t().stFail,"bad");});});
$("connect").addEventListener("click",function(){var d;try{d=unpack($("ansIn").value);}catch(e){setSt(t().stBad,"bad");return;}
 pc.setRemoteDescription(d).then(function(){setSt(t().stWait);}).catch(function(){setSt(t().stBad,"bad");});});
$("mkAns").addEventListener("click",function(){var d;try{d=unpack($("offerIn").value);}catch(e){setSt(t().stBad,"bad");return;}
 $("mkAns").disabled=true;setupPC();pc.ondatachannel=function(e){wireDC(e.channel);};
 pc.setRemoteDescription(d).then(function(){return pc.createAnswer();}).then(function(a){return pc.setLocalDescription(a);}).then(function(){return waitGather(pc);}).then(function(){
  $("ansOut").value=pack(pc.localDescription);show("ansWrap",true);setSt(t().stWait);}).catch(function(){setSt(t().stBad,"bad");$("mkAns").disabled=false;});});
function copyFrom(id,btn){var el=$(id);el.focus();el.select();var ok=function(){var o=btn.textContent;btn.textContent=t().copied;setTimeout(function(){btn.textContent=t().copy;},1200);};
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(el.value).then(ok,function(){try{document.execCommand("copy");ok();}catch(e){}});else{try{document.execCommand("copy");ok();}catch(e){}}}
$("copyOffer").addEventListener("click",function(){copyFrom("offerOut",this);});
$("copyAns").addEventListener("click",function(){copyFrom("ansOut",this);});

/* audio capture */
function meterOf(an){var d=new Uint8Array(an.fftSize);an.getByteTimeDomainData(d);var m=0;for(var i=0;i<d.length;i++){var v=Math.abs(d[i]-128)/128;if(v>m)m=v;}return m;}
function cfgObj(){return {t:"cfg",rate:parseInt($("rate").value,10)||16000,names:{a:clean($("nA").value,"A"),b:clean($("nB").value,"B"),s:clean($("sess").value,"call01")}};}
function startLive(){
 if(role==="host"){var c=cfgObj();rate=c.rate;names=c.names;}
 show("liveCard",true);
 if(!actx){var C=window.AudioContext||window.webkitAudioContext;
  try{actx=new C({sampleRate:rate});}catch(e){actx=new C();}
  if(actx.state==="suspended")actx.resume();
  myRate=actx.sampleRate;
  srcN=actx.createMediaStreamSource(stream);anMe=actx.createAnalyser();anMe.fftSize=1024;srcN.connect(anMe);
  proc=actx.createScriptProcessor(4096,1,1);var mute=actx.createGain();mute.gain.value=0;
  proc.onaudioprocess=function(e){if(!recording)return;var inp=e.inputBuffer.getChannelData(0),o=new Int16Array(inp.length);
   for(var i=0;i<inp.length;i++){var s=Math.max(-1,Math.min(1,inp[i]));o[i]=s<0?s*32768:s*32767;}chunks.push(o);};
  srcN.connect(proc);proc.connect(mute);mute.connect(actx.destination);
  if(remote){try{var rs=actx.createMediaStreamSource(remote);anThem=actx.createAnalyser();anThem.fftSize=1024;rs.connect(anThem);}catch(e){}}
  setInterval(function(){if(anMe)$("mMe").style.width=Math.min(100,meterOf(anMe)*140)+"%";if(anThem)$("mThem").style.width=Math.min(100,meterOf(anThem)*140)+"%";},120);
 }
 if(role==="host"){show("recBtn",true);$("recBtn").textContent=t().rec;}else{show("gNote",true);$("gNote").textContent=t().guestWait;}
 try{if(navigator.wakeLock)navigator.wakeLock.request("screen").then(function(w){wl=w;},function(){});}catch(e){}
}
function median(a){if(!a.length)return 0;var b=a.slice().sort(function(x,y){return x-y;});return b[Math.floor(b.length/2)];}
function beginRec(){chunks=[];recording=true;recStart=performance.now();show("resCard",false);$("outs").innerHTML="";
 clearInterval(tickT);tickT=setInterval(function(){$("timer").textContent=mmss((performance.now()-recStart)/1000);},250);$("recBtn").textContent=t().stopB;$("recBtn").classList.add("on");
 if(role==="guest"){$("gNote").textContent=t().recNow;}}
function endRec(){recording=false;clearInterval(tickT);$("recBtn").classList.remove("on");var n=0,i;for(i=0;i<chunks.length;i++)n+=chunks[i].length;var out=new Int16Array(n),p=0;
 for(i=0;i<chunks.length;i++){out.set(chunks[i],p);p+=chunks[i].length;}chunks=[];return out;}

/* wav */
function wavBlob(pcm,sr){var n=pcm.length,b=new ArrayBuffer(44+n*2),v=new DataView(b);
 function w(o,s){for(var i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));}
 w(0,"RIFF");v.setUint32(4,36+n*2,true);w(8,"WAVE");w(12,"fmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,"data");v.setUint32(40,n*2,true);
 new Int16Array(b,44,n).set(pcm);return new Blob([b],{type:"audio/wav"});}
function resample(pcm,from,to){if(from===to)return Promise.resolve(pcm);
 var C=window.OfflineAudioContext||window.webkitOfflineAudioContext,len=Math.ceil(pcm.length*to/from),oc=new C(1,len,to),buf=oc.createBuffer(1,pcm.length,from),ch=buf.getChannelData(0);
 for(var i=0;i<pcm.length;i++)ch[i]=pcm[i]/32768;var s=oc.createBufferSource();s.buffer=buf;s.connect(oc.destination);s.start();
 return new Promise(function(res,rej){var p=oc.startRendering(function(r){});if(p&&p.then)p.then(done,rej);else oc.oncomplete=function(e){done(e.renderedBuffer);};
  function done(rb){var d=rb.getChannelData(0),o=new Int16Array(d.length);for(var i=0;i<d.length;i++){var x=Math.max(-1,Math.min(1,d[i]));o[i]=x<0?x*32768:x*32767;}res(o);}});}

/* messages */
var rx=null;
function onMsg(e){
 if(typeof e.data!=="string"){ if(rx){rx.parts.push(new Int16Array(e.data));rx.got+=e.data.byteLength/2;var pct=Math.round(rx.got/rx.len*100);$("prog").textContent=t().recv+pct+"%";show("prog",true);}return;}
 var m;try{m=JSON.parse(e.data);}catch(x){return;}
 if(m.t==="ping"){try{dc.send(JSON.stringify({t:"pong",ts:m.ts}));}catch(x){}}
 else if(m.t==="pong"){var r=performance.now()-m.ts;rtts.push(r);if(rtts.length>10)rtts.shift();oneWay=median(rtts)/2;$("rttV").textContent=Math.round(median(rtts))+" ms";}
 else if(m.t==="cfg"){rate=m.rate;names=m.names;cfgGot=true;if(pc&&pc.connectionState==="connected")startLive();}
 else if(m.t==="start"){names=m.names;beginRec();}
 else if(m.t==="stop"){guestFinish();}
 else if(m.t==="file"){rx={len:m.len,rate:m.rate,got:0,parts:[]};}
 else if(m.t==="filedone"){var all=new Int16Array(rx.got),p=0;for(var i=0;i<rx.parts.length;i++){all.set(rx.parts[i],p);p+=rx.parts[i].length;}gotRemote={pcm:all,rate:rx.rate};rx=null;show("prog",false);if(hostPending)hostBuild();}
 else if(m.t==="nofile"){gotRemote={pcm:new Int16Array(0),rate:rate,none:true};if(hostPending)hostBuild();}
}
function sendFile(pcm,sr){return new Promise(function(res){
 dc.send(JSON.stringify({t:"file",len:pcm.length,rate:sr}));var off=0,STEP=8192;
 function pump(){while(off<pcm.length){if(dc.bufferedAmount>1048576){dc.onbufferedamountlow=function(){dc.onbufferedamountlow=null;pump();};return;}
  var part=pcm.subarray(off,Math.min(pcm.length,off+STEP));dc.send(part.buffer.slice(part.byteOffset,part.byteOffset+part.byteLength));off+=STEP;
  var pct=Math.round(Math.min(off,pcm.length)/pcm.length*100);$("prog").textContent=t().prep+" "+pct+"%";}
  dc.send(JSON.stringify({t:"filedone"}));res();}
 pump();});}

/* host */
var hostPending=false,hostPcm=null,hostRate=16000;
$("recBtn").addEventListener("click",function(){
 if(role!=="host")return;
 if(!recording){names=cfgObj().names;
  try{dc.send(JSON.stringify({t:"start",rate:rate,names:names}));}catch(e){return;}
  beginRec();}
 else{try{dc.send(JSON.stringify({t:"stop"}));}catch(e){}
  hostPcm=endRec();hostRate=myRate;hostPending=true;gotRemote=null;$("recBtn").disabled=true;
  $("prog").textContent=t().prep;show("prog",true);
  setTimeout(function(){if(hostPending&&!gotRemote){/* wait more */}},1000);}});
function hostBuild(){
 hostPending=false;$("recBtn").disabled=false;$("recBtn").textContent=t().rec;show("prog",false);
 var g=gotRemote,delay=Math.round(oneWay);
 resample(hostPcm,hostRate,rate).then(function(A){
  return resample(g.pcm,g.rate,rate).then(function(B0){return {A:A,B0:B0};});
 }).then(function(r){
  var A=r.A,B0=r.B0,pad=g.none?0:Math.round(delay/1000*rate),B=new Int16Array(pad+B0.length);B.set(B0,pad);
  var N=Math.max(A.length,B.length),A2=new Int16Array(N),B2=new Int16Array(N);A2.set(A);B2.set(B);
  var mx=0,i;for(i=0;i<N;i++){var s=Math.abs(A2[i]+B2[i]);if(s>mx)mx=s;}var k=mx>32000?32000/mx:1,M=new Int16Array(N);
  for(i=0;i<N;i++)M[i]=Math.round((A2[i]+B2[i])*k);
  var files=[{n:names.s+"_"+names.a+".wav",l:t().fA,b:wavBlob(A2,rate)}];
  if(!g.none){files.push({n:names.s+"_"+names.b+".wav",l:t().fB,b:wavBlob(B2,rate)});files.push({n:names.s+"_mix.wav",l:t().fMix,b:wavBlob(M,rate)});}
  showOuts(files);
  var im=$("infoN");im.textContent=g.none?t().noGuest:t().info.replace("%s",delay);show("infoN",true);
 }).catch(function(){setSt(t().stFail,"bad");});}
function showOuts(files){var box=$("outs");box.innerHTML="";show("resCard",true);
 files.forEach(function(f){var d=document.createElement("div");d.className="out";var u=URL.createObjectURL(f.b);f.u=u;
  d.innerHTML='<b></b><audio controls preload="none"></audio><a class="b" download></a>';d.querySelector("b").textContent=f.l+" — "+f.n;d.querySelector("audio").src=u;var a=d.querySelector("a");a.href=u;a.download=f.n;a.textContent=t().dl;box.appendChild(d);});
 if(files.length>1&&window.JSZip){var z=new JSZip();files.forEach(function(f){z.file(f.n,f.b);});var holder=document.createElement("div");holder.className="out";holder.innerHTML='<b></b>';holder.querySelector("b").textContent=t().zipMk;box.appendChild(holder);
  z.generateAsync({type:"blob",compression:"STORE"}).then(function(zb){var u=URL.createObjectURL(zb);holder.innerHTML='<b></b><a class="b"></a>';holder.querySelector("b").textContent=names.s+".zip";var a=holder.querySelector("a");a.href=u;a.download=names.s+".zip";a.textContent=t().zip;});}}

/* guest */
function guestFinish(){var pcm=endRec();var x=t();$("prog").textContent=x.prep;show("prog",true);
 var mine=wavBlob(pcm,myRate);var mb=$("mineBox");mb.innerHTML="";var p=document.createElement("p");p.textContent=x.mine;mb.appendChild(p);var a=document.createElement("a");a.className="b";a.href=URL.createObjectURL(mine);a.download=(names.s||"call")+"_"+(names.b||"B")+".wav";a.textContent=x.dl;mb.appendChild(a);show("mineBox",true);show("resCard",true);
 $("gNote").textContent=t().guestWait;
 sendFile(pcm,myRate).then(function(){show("prog",false);var s=document.createElement("p");s.textContent=t().sentOk;mb.appendChild(s);});}

applyLang();
})();
