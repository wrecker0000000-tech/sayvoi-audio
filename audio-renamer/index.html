var items=[],hidden=0,result=null;
function splitName(n){var i=n.lastIndexOf(".");return i>0?{b:n.slice(0,i),e:n.slice(i)}:{b:n,e:""};}
function natCmp(a,b){return a.localeCompare(b,undefined,{numeric:true,sensitivity:"base"});}

 var pat=$("pat").value||"{name}",st=parseInt($("start").value,10)||0,sp=parseInt($("step").value,10)||1,fd=$("find").value,rp=$("repl").value;

 document.title=L==="ar"?"إعادة تسمية الملفات الصوتية دفعة واحدة من ZIP | Sayvoi":"Batch Rename Audio Files from a ZIP | Sayvoi";

$("drop").addEventListener("click",function(){$("file").click();});
$("drop").addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();$("file").click();}});
["dragenter","dragover"].forEach(function(ev){$("drop").addEventListener(ev,function(e){e.preventDefault();$("drop").classList.add("hov");});});
["dragleave","drop"].forEach(function(ev){$("drop").addEventListener(ev,function(e){e.preventDefault();$("drop").classList.remove("hov");});});
$("drop").addEventListener("drop",function(e){if(e.dataTransfer&&e.dataTransfer.files.length)addFiles(e.dataTransfer.files);});
$("file").addEventListener("change",function(){if(this.files.length)addFiles(this.files);this.value="";});
["pat","start","step","order","clean","cs","flat","find","repl","names"].forEach(function(id){$(id).addEventListener(id==="order"||id==="clean"||id==="cs"||id==="flat"?"change":"input",compute);});
$("prev").addEventListener("click",compute);
$("clr").addEventListener("click",function(){items=[];hidden=0;result=null;$("names").value="";$("find").value="";$("repl").value="";$("pat").value="{name}";$("msg").style.display="none";refreshLoaded();compute();});
$("dlzip").addEventListener("click",buildZip);
$("dlcsv").addEventListener("click",csv);
$("langBtn").addEventListener("click",function(){L=L==="en"?"ar":"en";try{localStorage.setItem("sayvoi_lang",L);}catch(e){}applyLang();compute();});
