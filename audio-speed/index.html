     for(var d2=-st;d2<=st;d2++){
      var a2=b0+d2;if(a2<0||a2+N>len)continue;
      var dt=0,en2=1e-9;
      for(i=0;i<N;i+=2){var v2=ref[a2+i];dt+=ref[tp+i]*v2;en2+=v2*v2;}
      var e2=dt/Math.sqrt(en2);
      if(e2>bs2){bs2=e2;best=a2;}
     }
    }
   }
  }
  prev=best;
  for(c=0;c<nc;c++){
   var x=ch[c],y=out[c];
   for(i=0;i<N;i++){
    var oi=o+i,si=best+i;
    if(oi<0||si<0||si>=len)continue;
    y[oi]+=x[si]*win[i];
   }
  }
  if(k%200===0){if(prog)prog(k/K);await tick();}
 }
 return out.map(function(y){return y.subarray(0,nOut);});
}
/* resampling: speed and pitch change together. r>1 = faster. */
var KRES=256,KW=12,KTAB=null;
function kern(){
 if(KTAB)return KTAB;
 KTAB=new Float32Array(KW*KRES+2);
 for(var j=0;j<KTAB.length;j++){
  var t=j/KRES,s=t===0?1:Math.sin(Math.PI*t)/(Math.PI*t),w=t<KW?0.5+0.5*Math.cos(Math.PI*t/KW):0;
  KTAB[j]=s*w;
 }
 return KTAB;
}
async function resampleSpeed(ch,sr,r,prog){
 var T=kern(),cut=r>1?1/r:1,half=Math.ceil(KW/cut),res=[];
 for(var c=0;c<ch.length;c++){
  var x=ch[c],len=x.length,n=Math.floor(len/r),y=new Float32Array(n);
  for(var i=0;i<n;i++){
   var p=i*r,ip=Math.floor(p),s=0;
   var a=ip-half+1,b=ip+half;if(a<0)a=0;if(b>=len)b=len-1;
   for(var j=a;j<=b;j++){
    var t=Math.abs((p-j)*cut)*KRES,ti=t|0;
    if(ti>=KW*KRES)continue;
    var f=t-ti;
    s+=x[j]*(T[ti]*(1-f)+T[ti+1]*f);
   }
   y[i]=s*cut;
   if(i%400000===0){if(prog)prog((c+i/n)/ch.length);await tick();}
  }
  res.push(y);
 }
 return res;
}

/* ---------- encoding ---------- */
function encWav(ch,sr){
 var nc=ch.length,n=ch[0].length,buf=new ArrayBuffer(44+n*nc*2),v=new DataView(buf);
 function ws(o,s){for(var i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));}
 ws(0,"RIFF");v.setUint32(4,36+n*nc*2,true);ws(8,"WAVE");ws(12,"fmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,nc,true);
 v.setUint32(24,sr,true);v.setUint32(28,sr*nc*2,true);v.setUint16(32,nc*2,true);v.setUint16(34,16,true);ws(36,"data");v.setUint32(40,n*nc*2,true);
 var o=44;
 for(var i=0;i<n;i++)for(var c=0;c<nc;c++){var s=ch[c][i];s=s>1?1:s<-1?-1:s;v.setInt16(o,s<0?s*32768:s*32767,true);o+=2;}
 return new Blob([buf],{type:"audio/wav"});
}
function loadLame(){
 return new Promise(function(res,rej){
  if(window.lamejs)return res();
  var s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js";
  s.onload=function(){window.lamejs?res():rej();};s.onerror=rej;document.head.appendChild(s);
 });
}
function resample(x,from,to){
 var n=Math.floor(x.length*to/from),o=new Float32Array(n),r=from/to;
 for(var i=0;i<n;i++){var p=i*r,a=Math.floor(p),f=p-a,b=a+1<x.length?a+1:a;o[i]=x[a]*(1-f)+x[b]*f;}
 return o;
}
async function encMp3(ch,sr,kbps){
 await loadLame();
 var okRates=[8000,11025,12000,16000,22050,24000,32000,44100,48000];
 if(okRates.indexOf(sr)<0){var to=44100;ch=ch.map(function(x){return resample(x,sr,to);});sr=to;}
 if(sr<32000&&kbps>128)kbps=128;
 var nc=Math.min(2,ch.length),n=ch[0].length,enc=new lamejs.Mp3Encoder(nc,sr,kbps),parts=[],i,c,B=1152;
 var ints=[];
 for(c=0;c<nc;c++){var a=new Int16Array(n),x=ch[c];for(i=0;i<n;i++){var s=x[i];s=s>1?1:s<-1?-1:s;a[i]=s<0?s*32768:s*32767;}ints.push(a);}
 var blocks=0;
 for(i=0;i<n;i+=B){
  var d=nc===1?enc.encodeBuffer(ints[0].subarray(i,i+B)):enc.encodeBuffer(ints[0].subarray(i,i+B),ints[1].subarray(i,i+B));
  if(d.length)parts.push(new Uint8Array(d));
  if(++blocks%400===0)await tick();
 }
 var f=enc.flush();if(f.length)parts.push(new Uint8Array(f));
 return new Blob(parts,{type:"audio/mpeg"});
}

/* ---------- pipeline ---------- */
function parseSpeeds(){
 var v=$("spd").value.split(/[,\s،]+/).filter(Boolean),out=[];
 for(var i=0;i<v.length;i++){var n=Number(v[i]);if(!isFinite(n)||n<50||n>200)return null;if(out.indexOf(n)<0)out.push(n);}
 return out.length&&out.length<=8?out:null;
}
function opts(){return {keep:$("md").value==="keep",fmt:$("fmt").value,mono:$("chn").value==="mono"};}
async function makeVersion(dec,sp,o,stage){
 var ch=dec.ch;
 if(o.mono)ch=toMono(ch);
 if(sp===100)return {ch:ch,sr:dec.sr};
 var r=sp/100;
 var res=o.keep?await stretch(ch,dec.sr,r,function(p){stage("s_proc",p);}):await resampleSpeed(ch,dec.sr,r,function(p){stage("s_proc",p);});
 return {ch:res,sr:dec.sr};
}
function fmtT(s){var m=Math.floor(s/60),r=s-m*60;return m+":"+(r<10?"0":"")+r.toFixed(1);}
function renderRows(){
 var tb=$("tb");tb.innerHTML="";
 rows.slice(0,400).forEach(function(r,i){
  var tr=document.createElement("tr"),cells=[String(i+1),r.name,r.speed+"%",r.fail?"-":fmtT(r.before),r.fail?"-":fmtT(r.after)];
  cells.forEach(function(x,j){var td=document.createElement("td");td.textContent=x;if(j===1)td.dir="auto";if(j>=2)td.className="n";tr.appendChild(td);});
  tb.appendChild(tr);
 });
 $("tblBox").style.display=rows.length?"block":"none";
}
function dl(blob,name){var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(a.href);},4000);}
function setBusy(b){busy=b;refresh();$("clr").disabled=b;}
function outName(path,sp,ext,k){var i=path.lastIndexOf("."),b=i>path.lastIndexOf("/")?path.slice(0,i):path;return b+"_"+sp+"pct"+(k>1?"_"+k:"")+ext;}
async function runAll(){
 if(busy||!items.length)return;
 var t=T[L],o=opts(),sps=parseSpeeds(),n=items.length,ext=o.fmt==="wav"?".wav":".mp3";
 if(!sps){show(t.errSpd,true);return;}
 if(o.fmt!=="wav"){try{await loadLame();}catch(e){show(t.errMp3,true);return;}}
 var many=n>1||sps.length>1;
 if(many&&!window.JSZip){show(t.errLib,true);return;}
 setBusy(true);rows=[];renderRows();$("msg").style.display="none";
 var zip=many?new JSZip():null,used={},single=null,okCount=0,total=n*sps.length,done=0;
 try{
  for(var i=0;i<n;i++){
   var it=items[i],dec;
   try{setBar((done/total)*100);show(t.working+(i+1)+t.of+n+" · "+t.s_dec,false);dec=await decode(await it.get());}
   catch(e){sps.forEach(function(sp){rows.push({name:it.path,speed:sp,fail:true});});renderRows();done+=sps.length;continue;}
   for(var q=0;q<sps.length;q++){
    var sp=sps[q];
    var stage=function(k,f){setBar(((done+f)/total)*100);show(t.working+(i+1)+t.of+n+" · "+sp+"% · "+t[k],false);};
    var res=await makeVersion(dec,sp,o,stage);
    stage("s_enc",0.9);await tick();
    var blob=o.fmt==="wav"?encWav(res.ch,res.sr):await encMp3(res.ch,res.sr,+o.fmt);
    var k=1,nm=outName(it.path,sp,ext,k),key=nm.toLowerCase();
    while(used[key]){k++;nm=outName(it.path,sp,ext,k);key=nm.toLowerCase();}
    used[key]=1;
    rows.push({name:it.path,speed:sp,before:dec.ch[0].length/dec.sr,after:res.ch[0].length/res.sr});renderRows();
    okCount++;done++;
    if(zip)zip.file(nm,blob);else single={blob:blob,name:nm.split("/").pop()};
    res=null;await tick();
   }
   dec=null;
  }
  if(!okCount){show(t.errDec,true);hideBar();setBusy(false);return;}
  if(zip){
   show(t.working+n+t.of+n+" · "+t.s_zip,false);
   var zb=await zip.generateAsync({type:"blob",compression:"STORE"},function(m){setBar(m.percent);});
   dl(zb,"speed_changed.zip");show(t.doneZip,false);
  }else{dl(single.blob,single.name);show(t.doneOne,false);}
 }catch(e){show(t.errAny+(e&&e.message?e.message:e),true);}
 hideBar();setBusy(false);
}
async function preview(){
 if(busy||!items.length)return;
 var t=T[L],o=opts(),sps=parseSpeeds();
 if(!sps){show(t.errSpd,true);return;}
 setBusy(true);$("msg").style.display="none";
 try{
  var it=items[0],u8=await it.get(),dec=await decode(u8);
  var res=await makeVersion(dec,sps[0],o,function(k,f){setBar(f*100);show(t.working+"1 · "+t[k],false);});
  var ext=(it.name.match(/\.([a-z0-9]+)$/i)||[,""])[1].toLowerCase();
  urls.forEach(function(u){URL.revokeObjectURL(u);});urls=[];
  var ub=URL.createObjectURL(new Blob([u8],{type:MIME[ext]||""})),ua=URL.createObjectURL(encWav(res.ch,res.sr));
  urls.push(ub,ua);$("aB").src=ub;$("aA").src=ua;
  $("pv").style.display="block";
  $("pvInfo").setAttribute("data-b",dec.ch[0].length/dec.sr);$("pvInfo").setAttribute("data-a",res.ch[0].length/res.sr);$("pvInfo").setAttribute("data-s",sps[0]);
  refreshPv();
 }catch(e){show(t.errDec,true);}
 hideBar();setBusy(false);
}
function refreshPv(){
 var p=$("pvInfo");if(!p.getAttribute("data-s"))return;
 p.textContent=T[L].pvInfo+fmtT(+p.getAttribute("data-b"))+" → "+fmtT(+p.getAttribute("data-a"))+" · "+p.getAttribute("data-s")+"%";
}
function applyLang(){
 var t=T[L];document.documentElement.lang=L;document.documentElement.dir=t.dir;
 $("nav").innerHTML=t.nav;$("foot").innerHTML=t.foot;$("langBtn").textContent=t.btn;
 var a=document.querySelectorAll("[data-i]");for(var i=0;i<a.length;i++)a[i].textContent=t[a[i].getAttribute("data-i")];
 var h=document.querySelectorAll("[data-h]");for(var j=0;j<h.length;j++)h[j].textContent=t[h[j].getAttribute("data-h")];
 var o=document.querySelectorAll("option[data-k]");for(var m=0;m<o.length;m++)o[m].textContent=t[o[m].getAttribute("data-k")];
 ["prev","run","clr"].forEach(function(id){$(id).textContent=t[id];});
 document.title=L==="ar"?"تغيير سرعة الصوت: إبطاء الصوت أو تسريعه | Sayvoi":"Audio Speed Changer: Slow Down or Speed Up Audio | Sayvoi";
 refresh();renderRows();refreshPv();
}
$("drop").addEventListener("click",function(){$("file").click();});
$("drop").addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();$("file").click();}});
["dragenter","dragover"].forEach(function(ev){$("drop").addEventListener(ev,function(e){e.preventDefault();$("drop").classList.add("hov");});});
["dragleave","drop"].forEach(function(ev){$("drop").addEventListener(ev,function(e){e.preventDefault();$("drop").classList.remove("hov");});});
$("drop").addEventListener("drop",function(e){if(e.dataTransfer&&e.dataTransfer.files.length)addFiles(e.dataTransfer.files);});
$("file").addEventListener("change",function(){if(this.files.length)addFiles(this.files);this.value="";});
$("run").addEventListener("click",runAll);
$("prev").addEventListener("click",preview);
Array.prototype.forEach.call(document.querySelectorAll("[data-sp]"),function(b){b.addEventListener("click",function(){$("spd").value=b.getAttribute("data-sp").replace(",",", ");});});
$("clr").addEventListener("click",function(){items=[];skipped=0;rows=[];urls.forEach(function(u){URL.revokeObjectURL(u);});urls=[];$("pv").style.display="none";$("pvInfo").removeAttribute("data-s");$("aB").removeAttribute("src");$("aA").removeAttribute("src");$("msg").style.display="none";renderRows();refresh();});
$("langBtn").addEventListener("click",function(){L=L==="en"?"ar":"en";try{localStorage.setItem("sayvoi_lang",L);}catch(e){}applyLang();});
applyLang();
})();
