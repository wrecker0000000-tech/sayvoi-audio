 if(k.length>2&&(k.charAt(0)==="و"||k.charAt(0)==="ف"||k.charAt(0)==="ب"||k.charAt(0)==="ل")){var r=k.slice(1);if(AR_MAP.hasOwnProperty(r)&&AR_MAP[r]!==r&&r.length>2)return k.charAt(0)+AR_MAP[r];}
 if(k.length>4&&k.indexOf("ال")===0){var r2=k.slice(2);if(AR_MAP.hasOwnProperty(r2)&&AR_MAP[r2]!==r2&&r2.length>2)return "ال"+AR_MAP[r2];}
 return null;
}
function enFix(tok){var l=tok.toLowerCase();if(EN_MAP.hasOwnProperty(l)){var f=EN_MAP[l];return tok.charAt(0)===tok.charAt(0).toUpperCase()&&tok.charAt(0)!==tok.charAt(0).toLowerCase()?f.charAt(0).toUpperCase()+f.slice(1):f;}return null;}
function allowedTags(){return $("tags").value.split(",").map(function(x){return x.trim().toLowerCase();}).filter(Boolean);}
var SYMBOL_OK=/[\p{L}\p{N}\p{M}\s.,;:!?'"()\-–—…،؛؟\[\]<>\/%&+=_]/u;
function on(id){return $("r_"+id).checked;}
/* check one line: returns {issues:[{r,k,a,b}], fixed:string, nfix:number} */
function checkLine(line,idx,minW,maxW,tagsOK){
 var iss=[],fixed=line,nfix=0,ar=hasAr(line);
 function add(r,k,a,b,fx){iss.push({r:r,k:k,a:a,b:b,fx:!!fx});}
 if(!line.trim()){if(on("spaces"))add("spaces","m_empty","","",1);return{issues:iss,fixed:fixed,nfix:0,empty:true};}
 var m;
 if(on("hidden")){var hid=line.match(/[\u200B-\u200F\u202A-\u202E\u2066-\u2069\uFEFF\u00AD\u0640]/g);if(hid){add("hidden","m_hidden","","",1);fixed=fixed.replace(/[\u200B-\u200F\u202A-\u202E\u2066-\u2069\uFEFF\u00AD\u0640]/g,"");}}
 if(on("spaces")){if(/^\s|\s$|\s{2,}|\t/.test(line)){add("spaces","m_spaces","","",1);fixed=fixed.replace(/\s+/g," ").trim();}}
 if(on("diac")&&/[\u064B-\u065F\u0670]/.test(line)){add("diac","m_diac","","",1);fixed=fixed.replace(/[\u064B-\u065F\u0670]/g,"");}
 if(on("nums")){m=line.match(/[0-9\u0660-\u0669\u06F0-\u06F9]+/g);if(m)add("nums","m_nums",m.slice(0,4).join(" "),"",0);}
 // tags
 var tagRx=/\[[^\]\n]*\]|<[^>\n]*>/g,tgs=line.match(tagRx)||[];
 if(on("tags")){tgs.forEach(function(g){if(tagsOK.indexOf(g.toLowerCase())<0)add("tags","m_tags",g,"",0);});}
 var noTags=line.replace(tagRx," ");
 if(on("symbols")){var bad=[],seen={};Array.from(noTags).forEach(function(ch){if(!SYMBOL_OK.test(ch)&&!seen[ch]){seen[ch]=1;bad.push(ch);}});
  if(bad.length){add("symbols","m_symbols",bad.slice(0,5).join(" "),"",1);var rx2=new RegExp("["+bad.map(function(c){return c.replace(/[\]\\^-]/g,"\\$&");}).join("")+"]","gu");fixed=fixed.replace(rx2,"").replace(/ {2,}/g," ").trim();}
  var sy=noTags.match(/[@#*~^|\\{}$]/g);if(sy&&bad.indexOf(sy[0])<0){add("symbols","m_symbols",sy.slice(0,4).join(" "),"",1);fixed=fixed.replace(/[@#*~^|\\{}$]/g,"").replace(/ {2,}/g," ").trim();}}
 if(on("mixed")&&ar){m=noTags.match(/[A-Za-z]+/g);if(m)add("mixed","m_mixed",m.slice(0,4).join(" "),"",0);}
 if(on("punct")){m=noTags.match(PUNCT_ALL);if(m){add("punct","m_punct",m.slice(0,4).join(" "),"",1);fixed=fixed.replace(PUNCT_ALL,"").replace(/ {2,}/g," ").trim();}}
 if(on("pspace")){
  var ps=noTags.match(/\s[,.;:!?،؛؟]|[,;:!?،؛؟](?=[^\s\d"')\]\-.,;:!?،؛؟]|$)(?!$)/g);
  var sp1=/\s[,.;:!?،؛؟](?=\s|$)/.test(noTags),sp2=/[,;:!?،؛؟](?=[^\s\d"')\]\-.,;:!?،؛؟])/.test(noTags);
  if(sp1||sp2){add("pspace","m_pspace",sp1?"␣,":"",sp2?",x":"",1);
   fixed=fixed.replace(/\s+([,.;:!?،؛؟])/g,"$1").replace(/([,;:!?،؛؟])(?=[^\s\d"')\]\-.,;:!?،؛؟])/g,"$1 ");}}
 // words (on the fixed-of-space version for stability)
 var words=noTags.split(/[^\p{L}\p{M}\p{N}']+/u).filter(Boolean);
 if(on("repeat")){for(var i=1;i<words.length;i++){if(words[i].toLowerCase()===words[i-1].toLowerCase()&&words[i].length>1&&!/^\d+$/.test(words[i])){add("repeat","m_repeat",words[i]+" "+words[i],"",0);break;}}}
 if(on("elong")){m=noTags.match(/(\p{L})\1{2,}/gu);if(m)add("elong","m_elong",m[0],"",0);}
 if(!isNaN(minW)&&words.length<minW)add("len","m_short",words.length,minW,0);
 if(!isNaN(maxW)&&words.length>maxW)add("len","m_long",words.length,maxW,0);
 // spelling
 if(on("arspell")&&ar){var seenA={};
  fixed=fixed.replace(/(^|\s)(ان شاء الله|انشاء الله|إنشاء الله|ان شا الله)(?=\s|$|[.,،!؟?])/g,function(m0,pre,ph){add("arspell","m_spell",ph,"إن شاء الله",1);return pre+"إن شاء الله";});fixed=fixed.replace(/[\u0600-\u06FF]+/g,function(tok){var f=arFix(tok);if(f&&f!==tok){var key=tok;if(!seenA[key]){seenA[key]=1;add("arspell","m_spell",tok,f,1);}return f;}return tok;});}
 if(on("enspell")){var seenE={};fixed=fixed.replace(/[A-Za-z']+/g,function(tok){var f=enFix(tok);if(f&&f!==tok){if(!seenE[tok]){seenE[tok]=1;add("enspell","m_spell",tok,f,1);}return f;}return tok;});
  if(/(^|[\s"(])i(?=[\s,.!?'")]|$)/.test(noTags)&&/[A-Za-z]{2,}/.test(noTags)){add("enspell","m_spell","i","I",1);fixed=fixed.replace(/(^|[\s"(])i(?=[\s,.!?'")]|$)/g,"$1I");}}
 nfix=iss.filter(function(x){return x.fx;}).length;
 return{issues:iss,fixed:fixed,nfix:nfix};
}
var REP=null;
function msg(txt){var m=$("msg");m.textContent=txt;m.style.display=txt?"block":"none";}
function run(){
 msg("");var txt=$("ta").value;if(!txt.trim()){msg(T[L].errEmpty);return;}
 var lines=txt.replace(/\r\n?/g,"\n").split("\n");if(lines.length&&lines[lines.length-1]==="")lines.pop();
 var minW=parseInt($("minW").value,10),maxW=parseInt($("maxW").value,10),tagsOK=allowedTags();
 var rows=lines.map(function(l,i){var r=checkLine(l,i,minW,maxW,tagsOK);r.line=l;r.n=i+1;return r;});
 REP={rows:rows};render();
}
var ORDER=["nums","symbols","tags","mixed","diac","punct","spaces","hidden","repeat","elong","pspace","arspell","enspell","len"];
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function render(){
 var t=T[L],rows=REP.rows,total=0,badLines=0,cnt={};
 rows.forEach(function(r){if(r.issues.length){badLines++;total+=r.issues.length;}r.issues.forEach(function(i){cnt[i.r]=(cnt[i.r]||0)+1;});});
 $("res").style.display="block";var v=$("verdict");v.className="big "+(total?"bad":"ok");
 v.textContent=total?tf("hasprob",total,badLines,rows.length):tf("allgood",rows.length);
 var ph="";ORDER.forEach(function(k){if(cnt[k])ph+='<span class="pill err">'+esc(t["g_"+k])+": "+cnt[k]+"</span>";});$("pills").innerHTML=ph;
 var gh="";ORDER.forEach(function(k){var list=[];rows.forEach(function(r){r.issues.forEach(function(i){if(i.r===k)list.push({r:r,i:i});});});if(!list.length)return;
  gh+='<details class="g"'+(list.length<=30?" open":"")+'><summary>'+esc(t["g_"+k])+" ("+list.length+")</summary><ul>"+list.slice(0,300).map(function(x){return "<li><b>"+esc(t.line)+" "+x.r.n+"</b> — <small>"+esc(tf(x.i.k,x.i.a,x.i.b))+"</small></li>";}).join("")+(list.length>300?"<li>…</li>":"")+"</ul></details>";});
 $("groups").innerHTML=gh;
 var nf=rows.reduce(function(a,r){return a+r.nfix;},0);$("fix").disabled=!nf;
 if($("fixbox").style.display==="block")showFixed();
}
function showFixed(){var rows=REP.rows,nf=rows.reduce(function(a,r){return a+r.nfix;},0);$("out").value=rows.map(function(r){return r.fixed;}).join("\n");$("fixInfo").textContent=tf("fixInfo",nf);$("fixbox").style.display="block";}
$("fix").addEventListener("click",function(){if(REP)showFixed();try{$("fixbox").scrollIntoView({behavior:"smooth"});}catch(e){}});
$("go").addEventListener("click",run);
function cell(s){s=String(s==null?"":s);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}
function dlf(name,text,type){var u=URL.createObjectURL(new Blob(["\uFEFF"+text],{type:type})),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(u);},1000);}
$("csv").addEventListener("click",function(){if(!REP)return;var out=["line,type,details,text"];REP.rows.forEach(function(r){r.issues.forEach(function(i){out.push([r.n,i.r,tf(i.k,i.a,i.b),r.line].map(cell).join(","));});});dlf("transcript-report.csv",out.join("\r\n"),"text/csv;charset=utf-8");});
$("copy").addEventListener("click",function(){var v=$("out").value;if(!v)return;try{navigator.clipboard.writeText(v);}catch(e){$("out").select();try{document.execCommand("copy");}catch(e2){}}msg(T[L].copied);setTimeout(function(){msg("");},1200);});
$("dl").addEventListener("click",function(){var v=$("out").value;if(v)dlf("transcripts-fixed.txt",v,"text/plain;charset=utf-8");});
$("load").addEventListener("click",function(){$("fileIn").click();});
$("fileIn").addEventListener("change",function(){var f=this.files[0];this.value="";if(!f)return;var rd=new FileReader();rd.onload=function(){$("ta").value=String(rd.result||"").replace(/^\uFEFF/,"");};rd.readAsText(f,"UTF-8");});
$("ex").addEventListener("click",function(){$("ta").value=T[L].ex1.replace(/\\n/g,"\n");run();});
$("clr").addEventListener("click",function(){$("ta").value="";REP=null;$("res").style.display="none";$("fixbox").style.display="none";msg("");});
$("langBtn").addEventListener("click",function(){L=L==="en"?"ar":"en";try{localStorage.setItem("sayvoi_lang",L);}catch(e){}applyLang();});
buildOpts();applyLang();
})();
</script>
