function splitScript(txt){
 var out=[];
 txt.split(/\r?\n+/).forEach(function(line){
  line=line.trim();if(!line)return;
  line.split(/(?<=[.!?؟۔…])\s+/).forEach(function(s){

  ctx.globalAlpha=1;
 }
 if(gTot>0){ctx.fillStyle="rgba(255,255,255,.85)";ctx.fillRect(0,H-Math.max(5,H*0.008),W*Math.min(1,gT/gTot),Math.max(5,H*0.008));}
 if($("wm").checked){
  ctx.font="700 "+Math.round(Math.min(W,H)*0.03)+"px 'Segoe UI',Arial,sans-serif";ctx.textAlign="left";ctx.direction="ltr";
  ctx.fillStyle="rgba(255,255,255,.75)";ctx.fillText("Sayvoi · convert.sayvoi.com",W*0.03,H-Math.max(20,H*0.04));
 }
}
function drawStatic(){
 if(running)return;
 var cv=$("cv"),d=dims();if(cv.width!==d[0]||cv.height!==d[1]){cv.width=d[0];cv.height=d[1];}
 var pl=plan();draw(0,1,pl.dur[0]||3,pl.slides.length?pl:{slides:[T[L].ph],dur:[3]},0,0);
}
function loadImg(f){return new Promise(function(res){var u=URL.createObjectURL(f),im=new Image();im.onload=function(){res(im);};im.onerror=function(){res(null);};im.src=u;});}
async function addImgs(list){
 var arr=Array.prototype.slice.call(list).filter(function(f){return /^image\//.test(f.type);});
 for(var i=0;i<arr.length&&imgs.length<30;i++){var im=await loadImg(arr[i]);if(im)imgs.push(im);}
 refresh();drawStatic();
}
async function setAudio(f){
 aud=null;audDur=0;
 try{
  var ctx=new (window.AudioContext||window.webkitAudioContext)(),buf=await ctx.decodeAudioData(await f.arrayBuffer());
  aud=buf;audDur=buf.duration;try{ctx.close();}catch(e){}
 }catch(e){show(T[L].errAudRead,true);}
 refresh();updCount();
}
function refresh(){
 var t=T[L];
 $("imgInfo").textContent=imgs.length?t.imgN+imgs.length:t.imgNone;
 $("audInfo").textContent=aud?t.audN+audDur.toFixed(1)+"s":t.audNone;
 $("dropAud").style.display=$("mode").value==="audio"?"block":"none";
 $("cpsBox").style.display=$("mode").value==="audio"?"none":"block";
 $("prev").disabled=running;$("mk").disabled=running;$("stop").disabled=!running;$("clr").disabled=running;
}
function speak(text){
 try{
  var u=new SpeechSynthesisUtterance(text);u.lang=isAr(text)?"ar-SA":"en-US";window.speechSynthesis.cancel();window.speechSynthesis.speak(u);
 }catch(e){}
}
function pickMime(){
 var c=["video/mp4;codecs=avc1.42E01E,mp4a.40.2","video/mp4","video/webm;codecs=vp9,opus","video/webm;codecs=vp8,opus","video/webm"];
 if(!window.MediaRecorder)return "";
 for(var i=0;i<c.length;i++){try{if(MediaRecorder.isTypeSupported(c[i]))return c[i];}catch(e){}}
 return "";
}
async function run(record){
 if(running)return;
 var t=T[L],pl=plan();
 if(!pl.slides.length){show(t.errScr,true);return;}
 if($("mode").value==="audio"&&!aud){show(t.errAud,true);return;}
 var mime="";
 if(record){mime=pickMime();if(!window.MediaRecorder||!$("cv").captureStream){show(t.errRec,true);return;}}
 running=true;cancel=false;refresh();$("msg").style.display="none";$("pv").style.display="none";
 var cv=$("cv"),d=dims();cv.width=d[0];cv.height=d[1];
 var actx=null,src=null,chunks=[],rec=null,dest=null,tracks=[];
 try{
  var stream=record?cv.captureStream(30):null;
  if($("mode").value==="audio"&&aud){
   actx=new (window.AudioContext||window.webkitAudioContext)();
   if(actx.state==="suspended")await actx.resume();
   src=actx.createBufferSource();src.buffer=aud;
   if(record){dest=actx.createMediaStreamDestination();src.connect(dest);tracks=dest.stream.getAudioTracks();}
   else src.connect(actx.destination);
  }
  if(record){
   var ms=new MediaStream(stream.getVideoTracks().concat(tracks));
   rec=new MediaRecorder(ms,mime?{mimeType:mime,videoBitsPerSecond:4000000}:{});
   rec.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data);};
   rec.start(500);
  }
  if(src)src.start();
  var total=pl.total+0.6,t0=performance.now(),si=-1,acc=[],s=0;
  pl.dur.forEach(function(x){s+=x;acc.push(s);});
  await new Promise(function(done){
   function frame(){
    var el=(performance.now()-t0)/1000;
    if(cancel||el>=total){done();return;}
    var k=0;while(k<acc.length-1&&el>=acc[k])k++;
    var start=k?acc[k-1]:0;
    if(k!==si){si=k;if(!record&&$("tts").checked)speak(pl.slides[k]);}
    draw(k,el-start,pl.dur[k],pl,el,pl.total);
    setBar(el/total*100);show(t.working+Math.round(el)+" / "+Math.round(total)+"s",false);
    requestAnimationFrame(frame);
   }
   frame();
  });
  try{window.speechSynthesis.cancel();}catch(e){}
  if(src){try{src.stop();}catch(e){}}
  if(record){
   await new Promise(function(r){rec.onstop=r;try{rec.stop();}catch(e){r();}});
   if(!cancel){
    var blob=new Blob(chunks,{type:(rec.mimeType||mime||"video/webm").split(";")[0]}),ext=/mp4/.test(blob.type)?"mp4":"webm";
    if(urlOut)URL.revokeObjectURL(urlOut);urlOut=URL.createObjectURL(blob);
    $("vo").src=urlOut;$("dl").href=urlOut;$("dl").download="script_video."+ext;
    $("vinfo").textContent=t.vinfo+Math.round(pl.total)+"s · "+ext.toUpperCase()+" · "+(blob.size/1048576).toFixed(1)+" MB";
    $("pv").style.display="block";$("msg").style.display="none";
   }
  }else $("msg").style.display="none";
 }catch(e){show(t.errAny+(e&&e.message?e.message:e),true);}
 try{if(actx)actx.close();}catch(e){}
 hideBar();running=false;refresh();drawStatic();
}
function applyLang(){
 var t=T[L];var vf=$("vidFrame");if(vf){var vs="https://www.youtube-nocookie.com/embed/"+(L==="ar"?"uGcA22fTWuI":"Flbal2mxQE4")+"?rel=0";if(vf.getAttribute("src")!==vs)vf.setAttribute("src",vs);}
 document.documentElement.lang=L;document.documentElement.dir=t.dir;
 $("foot").innerHTML=t.foot;$("langBtn").textContent=t.btn;
 var a=document.querySelectorAll("[data-i]");for(var i=0;i<a.length;i++)a[i].textContent=t[a[i].getAttribute("data-i")];
 var h=document.querySelectorAll("[data-h]");for(var j=0;j<h.length;j++)h[j].textContent=t[h[j].getAttribute("data-h")];
 var o=document.querySelectorAll("option[data-k]");for(var m=0;m<o.length;m++)o[m].textContent=t[o[m].getAttribute("data-k")];
 var p=document.querySelectorAll("[data-p]");for(var q=0;q<p.length;q++)p[q].setAttribute("placeholder",t[p[q].getAttribute("data-p")]);
 document.title=L==="ar"?"من السكربت إلى فيديو | Sayvoi":"Script to Video | Sayvoi";
 refresh();updCount();
}
$("dropImg").addEventListener("click",function(){$("imgs").click();});
$("dropAud").addEventListener("click",function(){$("aud").click();});
$("imgs").addEventListener("change",function(){if(this.files.length)addImgs(this.files);this.value="";});
$("aud").addEventListener("change",function(){if(this.files.length)setAudio(this.files[0]);this.value="";});
["scr","size","theme","fs","mode","cps","wm"].forEach(function(id){$(id).addEventListener(id==="scr"?"input":"change",function(){refresh();updCount();});});
$("ex").addEventListener("click",function(){$("scr").value=EXAMPLE[L];updCount();});
$("clr").addEventListener("click",function(){$("scr").value="";imgs=[];aud=null;audDur=0;$("pv").style.display="none";$("msg").style.display="none";refresh();updCount();});
$("prev").addEventListener("click",function(){run(false);});
$("mk").addEventListener("click",function(){run(true);});
$("stop").addEventListener("click",function(){cancel=true;});
$("langBtn").addEventListener("click",function(){L=L==="en"?"ar":"en";try{localStorage.setItem("sayvoi_lang",L);}catch(e){}applyLang();});
applyLang();
})();
</script>
