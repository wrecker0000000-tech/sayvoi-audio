   st=fmtSize(it.file.size)+" → <b>"+fmtSize(it.out.size)+"</b> "+(it.small?'<span class="s">'+t.already+'</span>':(pc>0?'<span class="g">−'+pc+'%</span>':'<span class="s">+'+(-pc)+'%</span>'))+(it.ow!==it.w?' · '+it.w+"×"+it.h+" → "+it.ow+"×"+it.oh:(it.w?' · '+it.w+"×"+it.h:""))+(it.note?" · "+esc(it.note):"");}
  else st=t.waiting;
  d.innerHTML='<img alt="">'+'<div class="m"><div class="n">'+esc(it.file.name)+'</div><div class="s">'+st+'</div></div>';
  d.firstChild.src=it.url;
  if(it.status==="done"){var a=document.createElement("a");a.className="b";a.textContent=t.dl;a.href=URL.createObjectURL(it.out);a.setAttribute("download",it.outName);d.appendChild(a);}
  box.appendChild(d);});
 var any=done>0;$("zip").disabled=!any;$("clr").disabled=!items.length;
 $("tot").textContent=done&&MODE==="compress"&&so>0?t.saved+fmtSize(Math.max(0,so-sn))+" ("+Math.round((1-sn/so)*100)+"%)":"";}
function add(list){
 var n=0;[].forEach.call(list,function(f){if(/^image\//.test(f.type)||/\.(jpe?g|png|webp|gif|bmp|avif)$/i.test(f.name)){if(items.length<100){items.push({id:++seq,file:f,url:URL.createObjectURL(f),status:"wait"});n++;}}});
 if(n){render();runAll();}}

["dragover","dragenter"].forEach(function(ev){$("drop").addEventListener(ev,function(e){e.preventDefault();this.classList.add("over");});});
["dragleave","drop"].forEach(function(ev){$("drop").addEventListener(ev,function(e){e.preventDefault();this.classList.remove("over");});});
$("drop").addEventListener("drop",function(e){if(e.dataTransfer&&e.dataTransfer.files)add(e.dataTransfer.files);});
$("clr").addEventListener("click",function(){run++;items.forEach(function(it){try{URL.revokeObjectURL(it.url);}catch(e){}});items=[];render();});
$("zip").addEventListener("click",async function(){
 if(!window.JSZip)return;var z=new JSZip(),used={};
 items.forEach(function(it){if(it.status!=="done")return;var n=it.outName,c=1;while(used[n.toLowerCase()]){c++;n=n.replace(/(\.[^.]+)$/,"_"+c+"$1");}used[n.toLowerCase()]=1;z.file(n,it.out);});
 var b=await z.generateAsync({type:"blob",compression:"STORE"});var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="resized-images"+".zip";document.body.appendChild(a);a.click();setTimeout(function(){a.remove();},500);});
["q","fmt","rw","rh","pct","lock"].forEach(function(id){var e=$(id);if(e)e.addEventListener("input",function(){if(id==="q")$("qv").textContent=this.value+"%";mark();schedule();});});

if($("fmtSeg")){$("fmtSeg").addEventListener("click",function(e){var v=e.target.getAttribute("data-v");if(!v)return;this.setAttribute("data-v",v);lsSet("im_"+MODE+"_fmt",v);mark();schedule();});}
