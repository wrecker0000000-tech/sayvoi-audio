["dragleave","drop"].forEach(function(ev){$("drop").addEventListener(ev,function(e){e.preventDefault();this.classList.remove("over");});});
$("drop").addEventListener("drop",function(e){if(e.dataTransfer&&e.dataTransfer.files)add(e.dataTransfer.files);});
$("clr").addEventListener("click",function(){run++;items.forEach(function(it){try{URL.revokeObjectURL(it.url);}catch(e){}});items=[];render();});
$("zip").addEventListener("click",async function(){
 if(!window.JSZip)return;var z=new JSZip(),used={};
 items.forEach(function(it){if(it.status!=="done")return;var n=it.outName,c=1;while(used[n.toLowerCase()]){c++;n=n.replace(/(\.[^.]+)$/,"_"+c+"$1");}used[n.toLowerCase()]=1;z.file(n,it.out);});
 var b=await z.generateAsync({type:"blob",compression:"STORE"});var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=(MODE==="compress"?"compressed-images":"converted-images")+".zip";document.body.appendChild(a);a.click();setTimeout(function(){a.remove();},500);});
["q","max","fmt","bg"].forEach(function(id){var e=$(id);if(e)e.addEventListener("input",function(){if(id==="q")$("qv").textContent=this.value+"%";lsSet("im_"+MODE+"_"+id,this.value);schedule();});});
if($("fmtSeg")){$("fmtSeg").addEventListener("click",function(e){var v=e.target.getAttribute("data-v");if(!v)return;this.setAttribute("data-v",v);lsSet("im_"+MODE+"_fmt",v);mark();schedule();});}
function mark(){var s=$("fmtSeg");if(!s)return;var v=s.getAttribute("data-v");[].forEach.call(s.children,function(b){b.classList.toggle("on",b.getAttribute("data-v")===v);});var nq=(v==="png");$("qWrap").style.opacity=nq?".4":"1";$("q").disabled=nq;$("bgWrap").style.display=(v==="jpeg")?"block":"none";}
["q","max","fmt","bg"].forEach(function(id){var e=$(id);if(!e)return;var v=lsGet("im_"+MODE+"_"+id,null);if(v!==null)e.value=v;});
if($("fmtSeg")){var fv=lsGet("im_"+MODE+"_fmt",null);if(fv==="jpeg"||fv==="png"||fv==="webp")$("fmtSeg").setAttribute("data-v",fv);}
function applyLang(){
 var t=T[L];document.documentElement.lang=L;document.documentElement.dir=t.dir;
 $("foot").innerHTML=t.foot;$("langBtn").textContent=t.btn;
 var a=document.querySelectorAll("[data-i]");for(var i=0;i<a.length;i++){var k=a[i].getAttribute("data-i");if(t[k]!==undefined)a[i].textContent=t[k];}
 var h=document.querySelectorAll("[data-h]");for(var j=0;j<h.length;j++)h[j].textContent=t[h[j].getAttribute("data-h")];
 $("zip").textContent=t.zip;$("clr").textContent=t.clr;$("qv").textContent=$("q").value+"%";
 document.title=t.title;var md=document.querySelector('meta[name="description"]');
 var vf=$("vidFrame");if(vf){var vs="https://www.youtube-nocookie.com/embed/"+(L==="ar"?VID.ar:VID.en)+"?rel=0";if(vf.getAttribute("src")!==vs)vf.setAttribute("src",vs);}
 render();}
$("langBtn").addEventListener("click",function(){L=L==="en"?"ar":"en";lsSet("sayvoi_lang",L);applyLang();});
$("qv").textContent=$("q").value+"%";mark();applyLang();
})();
</script>
</body>
</html>
