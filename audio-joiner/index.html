 busy=true;refresh();$("run").disabled=true;$("pv").style.display="none";$("msg").style.display="none";setBar(0);
 try{
  var s=$("sr").value,rate;
  if(s==="auto"){var u0=await items[0].get();rate=wavRate(u0)||getCtx(0).sampleRate;}else rate=+s;
  var mono=$("chn").value==="mono",fmt=$("fmt").value,gap=Math.max(0,parseFloat($("gap").value)||0),gapN=Math.round(gap*rate);
  var chunks=[],nc=1,total=0,n=items.length,i,c;
  for(i=0;i<n;i++){
   show(t.working+(i+1)+t.of+n,false);setBar(60*i/n);await tick();
   var u8=await items[i].get(),d;
   try{d=await decode(u8,rate);}catch(e){throw new Error(t.errDec+items[i].name);}
   u8=null;
   var ch=d.ch;
   if(d.sr!==rate)ch=ch.map(function(x){return resample(x,d.sr,rate);});
   if(mono)ch=toMono(ch);
   if(ch.length>2)ch=[ch[0],ch[1]];
   if(ch.length>nc)nc=ch.length;
   items[i].len=ch[0].length/rate;
   chunks.push(ch);total+=ch[0].length+(i<n-1?gapN:0);
  }
  if(mono)nc=1;
  show(t.working+n+t.of+n,false);setBar(62);await tick();
  var out=[];for(c=0;c<nc;c++)out.push(new Float32Array(total));
  var pos=0;
  for(i=0;i<n;i++){
   var ck=chunks[i],len=ck[0].length;
   for(c=0;c<nc;c++)out[c].set(ck[c<ck.length?c:0],pos);
   pos+=len+gapN;chunks[i]=null;
  }
  chunks=null;
  setBar(66);show(t.s_enc,false);await tick();
  var blob,ext;
  if(fmt==="wav"){blob=encWav(out,rate);ext=".wav";}
  else{try{blob=await encMp3(out,rate,+fmt);}catch(e){throw new Error(t.errMp3);}ext=".mp3";}
  if(outUrl)URL.revokeObjectURL(outUrl);
  outBlob=blob;outBlob._ext=ext;outUrl=URL.createObjectURL(blob);
  $("aOut").src=outUrl;$("pvInfo").textContent=t.pvInfo+dur(total/rate)+" · "+sz(blob.size);
  $("pv").style.display="block";
  setBar(100);show(t.done,false);
  setTimeout(hideBar,600);
 }catch(e){
  hideBar();show(e&&e.message&&e.message.indexOf(" ")>-1?e.message:t.errAny+(e&&e.message||e),true);
 }
 busy=false;refresh();
}
function dlOut(){
 if(!outBlob)return;
 var a=document.createElement("a");a.href=outUrl;a.download=cleanName()+(outBlob._ext||".wav");document.body.appendChild(a);a.click();document.body.removeChild(a);
}
function applyLang(){
 var t=T[L];
 document.documentElement.lang=L;document.documentElement.dir=t.dir;
 $("foot").innerHTML=t.foot;$("langBtn").textContent=t.btn;
 var a=document.querySelectorAll("[data-i]");for(var i=0;i<a.length;i++)a[i].textContent=t[a[i].getAttribute("data-i")];
 var h=document.querySelectorAll("[data-h]");for(var j=0;j<h.length;j++)h[j].textContent=t[h[j].getAttribute("data-h")];
 var o=document.querySelectorAll("option[data-k]");for(var m=0;m<o.length;m++)o[m].textContent=t[o[m].getAttribute("data-k")];
 $("run").textContent=t.run;$("clr").textContent=t.clr;
 document.title=L==="ar"?"دمج الصوت: ادمج ملفات صوتية في ملف واحد | Sayvoi":"Audio Joiner: Merge Audio Files into One | Sayvoi";
 refresh();
}
var drop=$("drop"),fi=$("file");
drop.addEventListener("click",function(){fi.click();});
drop.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();fi.click();}});
["dragenter","dragover"].forEach(function(ev){drop.addEventListener(ev,function(e){e.preventDefault();drop.classList.add("hov");});});
["dragleave","drop"].forEach(function(ev){drop.addEventListener(ev,function(e){e.preventDefault();drop.classList.remove("hov");});});
drop.addEventListener("drop",function(e){if(e.dataTransfer&&e.dataTransfer.files)addFiles(e.dataTransfer.files);});
fi.addEventListener("change",function(){addFiles(fi.files);fi.value="";});
$("sortN").addEventListener("click",function(){if(!busy){items.sort(natural);refresh();}});
$("rev").addEventListener("click",function(){if(!busy){items.reverse();refresh();}});
$("run").addEventListener("click",join);
$("dl").addEventListener("click",dlOut);
$("clr").addEventListener("click",function(){if(busy)return;items=[];skipped=0;$("pv").style.display="none";$("msg").style.display="none";if(outUrl){URL.revokeObjectURL(outUrl);outUrl=null;}outBlob=null;refresh();});
$("langBtn").addEventListener("click",function(){L=L==="en"?"ar":"en";try{localStorage.setItem("sayvoi_lang",L);}catch(e){}applyLang();});
applyLang();
})();
</script>
