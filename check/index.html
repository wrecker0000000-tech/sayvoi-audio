  /* ---------- header probing ---------- */
  function probeRate(ab){
    try{
      var u = new Uint8Array(ab), n = u.length, v = new DataView(ab), i, r = 0;
      function s4(o){ return String.fromCharCode(u[o],u[o+1],u[o+2],u[o+3]); }
      if (n > 44 && s4(0) === "RIFF" && s4(8) === "WAVE"){
        var p = 12;
        while (p + 8 <= n){
          var id = s4(p), sz = v.getUint32(p+4,true);
          if (id === "fmt "){ r = v.getUint32(p+12,true); break; }
          p += 8 + sz + (sz & 1);
        }
      } else if (n > 22 && s4(0) === "fLaC"){
        r = (u[18] << 12) | (u[19] << 4) | (u[20] >> 4);
      } else if (n > 40 && s4(0) === "OggS"){
        for (i = 0; i < Math.min(n - 20, 600); i++){
          if (u[i] === 1 && s4(i+1) === "vorb" && u[i+5] === 0x69 && u[i+6] === 0x73){ r = v.getUint32(i+12,true); break; }
          if (s4(i) === "Opus" && s4(i+4) === "Head"){ r = 48000; break; }
        }
      } else if (n > 12 && s4(4) === "ftyp"){
        var q = 0;
        while (q + 8 <= n){
          var bs = v.getUint32(q), bt = s4(q+4), hdr = 8;
          if (bs === 1){ bs = v.getUint32(q+12); hdr = 16; }
          if (bs === 0) bs = n - q;
          if (bt === "moov"){
            var e = Math.min(n - 20, q + bs);
            for (i = q + hdr; i < e; i++){
              if (s4(i) === "mdhd"){ r = u[i+4] === 1 ? v.getUint32(i+24) : v.getUint32(i+16); break; }
            }
            break;
          }
          if (bs < 8) break;
          q += bs;
        }
      } else if (n > 4 && u[0] === 0x1A && u[1] === 0x45 && u[2] === 0xDF && u[3] === 0xA3){
        r = 48000;
      } else {
        var o = 0;
        if (s4(0).slice(0,3) === "ID3" && n > 10){
          o = 10 + ((u[6] & 127) << 21 | (u[7] & 127) << 14 | (u[8] & 127) << 7 | (u[9] & 127));
        }
        for (i = o; i < Math.min(n - 4, o + 4096); i++){
          if (u[i] === 0xFF && (u[i+1] & 0xE0) === 0xE0){
            var ver = (u[i+1] >> 3) & 3, lay = (u[i+1] >> 1) & 3, si = (u[i+2] >> 2) & 3;
            if (ver !== 1 && lay !== 0 && si !== 3){
              r = (ver === 3 ? [44100,48000,32000] : ver === 2 ? [22050,24000,16000] : [11025,12000,8000])[si];
              break;
            }
            if (lay === 0 && (u[i+1] & 0xF6) === 0xF0){
              r = [96000,88200,64000,48000,44100,32000,24000,22050,16000,12000,11025,8000,7350][(u[i+2] >> 2) & 15] || 0;
              break;
            }
          }
        }
      }
      return (r >= 3000 && r <= 768000) ? r : 0;
    }catch(e){ return 0; }
  }
  function detectFormat(ab, name){
    var u = new Uint8Array(ab), n = u.length;
    function s4(o){ return String.fromCharCode(u[o],u[o+1],u[o+2],u[o+3]); }
    if (n > 12 && s4(0) === "RIFF" && s4(8) === "WAVE") return "wav";
    if (n > 4 && s4(0) === "fLaC") return "flac";
    if (n > 4 && s4(0) === "OggS") return "ogg";
    if (n > 12 && s4(4) === "ftyp") return "m4a";
    if (n > 4 && u[0] === 0x1A && u[1] === 0x45 && u[2] === 0xDF && u[3] === 0xA3) return "webm";
    if (n > 3 && (s4(0).slice(0,3) === "ID3" || (u[0] === 0xFF && (u[1] & 0xE0) === 0xE0))) return "mp3";
    var m = /\.([a-z0-9]+)$/i.exec(name || ""); return m ? m[1].toLowerCase() : "?";
  }
  // WAV/FLAC bit depth from header (0 if unknown)
  function probeBits(ab, fmt){
    try{
      var u = new Uint8Array(ab), v = new DataView(ab), n = u.length;
      function s4(o){ return String.fromCharCode(u[o],u[o+1],u[o+2],u[o+3]); }
      if (fmt === "wav"){
        var p = 12;
        while (p + 8 <= n){
          var id = s4(p), sz = v.getUint32(p+4,true);
          if (id === "fmt "){ return v.getUint16(p+22,true); }
          p += 8 + sz + (sz & 1);
        }
      } else if (fmt === "flac" && n > 22){
        return (((u[20] & 1) << 4) | (u[21] >> 4)) + 1;
      }
    }catch(e){}
    return 0;
  }

  /* ---------- analysis ---------- */
  function toDb(x){ return x > 1e-9 ? 20 * Math.log10(x) : -120; }
  function round(x, d){ var p = Math.pow(10, d); return Math.round(x * p) / p; }

  async function sha(ab){
    try{
      var h = await crypto.subtle.digest("SHA-256", ab), a = new Uint8Array(h), s = "";
      for (var i = 0; i < a.length; i++) s += (a[i] < 16 ? "0" : "") + a[i].toString(16);
      return s;
    }catch(e){ return ""; }
  }

  async function analyze(file){
    var r = {name: file.name, size: file.size};
    if (file.size > 200 * 1024 * 1024){ r.error = "toobig"; return r; }
    var ab = await file.arrayBuffer();
    r.hash = await sha(ab);
    r.fmt = detectFormat(ab, file.name);
    r.bits = probeBits(ab, r.fmt);
    var AC = window.AudioContext || window.webkitAudioContext;
    var nat = probeRate(ab), ctx, buf;
    try{ ctx = nat ? new AC({sampleRate: nat}) : new AC(); }catch(e){ ctx = new AC(); }
    try{ buf = await ctx.decodeAudioData(ab); }
    catch(e){ r.error = "decodefail"; return r; }
    finally{ try{ ctx.close(); }catch(e){} }
    r.sr = nat || Math.round(buf.sampleRate);
    r.ch = buf.numberOfChannels;
    r.dur = buf.duration;
    var N = buf.length, C = buf.numberOfChannels, d = [];
    for (var c = 0; c < C; c++) d.push(buf.getChannelData(c));
    var peak = 0, clipped = 0, run = 0, sumAll = 0, dcSum = 0, ident = (C === 2);
    var fl = Math.max(1, Math.round(buf.sampleRate * 0.02)), nf = Math.floor(N / fl), fr = new Float64Array(nf), fi = 0, fs = 0, fc = 0;
    var d0 = d[0], d1 = C > 1 ? d[1] : null;
    for (var i = 0; i < N; i++){
      var s = d0[i];
      if (C > 1){ s = 0; for (var k = 0; k < C; k++) s += d[k][i]; s /= C; }
      var a = Math.abs(s);
      // peak across real channels
      var ap = 0;
      for (var q = 0; q < C; q++){ var v = Math.abs(d[q][i]); if (v > ap) ap = v; }
      if (ap > peak) peak = ap;
      if (ap >= 0.999){ run++; if (run === 3) clipped += 3; else if (run > 3) clipped++; } else run = 0;
      if (ident && d1[i] !== d0[i]) ident = false;
      dcSum += s; sumAll += s * s;
      fs += s * s; fc++;
      if (fc === fl && fi < nf){ fr[fi++] = Math.sqrt(fs / fc); fs = 0; fc = 0; }
    }
    r.peak = toDb(peak);
    r.rms = toDb(Math.sqrt(sumAll / Math.max(1, N)));
    r.clipPct = N ? clipped / N * 100 : 0;
    r.dc = Math.abs(dcSum / Math.max(1, N));
    r.fake = (C === 2 && ident && peak > 0);
    // frame statistics
    if (nf >= 5){
      var dbs = Array.prototype.map.call(fr, toDb), sorted = dbs.slice().sort(function(x, y){ return x - y; });
      var noise = sorted[Math.floor(nf * 0.1)];
      r.noise = noise;
      var thr = Math.max(noise + 12, -55), first = -1, last = -1, actSum = 0, actN = 0;
      for (var f = 0; f < nf; f++){
        if (dbs[f] > thr){
          if (first < 0) first = f;
          last = f; actSum += fr[f] * fr[f]; actN++;
        }
      }
      if (first < 0){ r.nospeech = true; r.snr = null; r.lead = null; r.trail = null; }
      else {
        r.lead = first * 0.02; r.trail = (nf - 1 - last) * 0.02;
        r.snr = toDb(Math.sqrt(actSum / actN)) - noise;
      }
    } else { r.noise = r.peak; r.nospeech = true; r.snr = null; r.lead = null; r.trail = null; }
    return r;
  }

  /* ---------- evaluation ---------- */
  function num(id){ var v = parseFloat($(id).value); return isNaN(v) ? null : v; }
  function evaluate(r, dupOf){
    var iss = [], level = 0; // 0 ok 1 warn 2 fail
    function add(lv, msg){ iss.push({lv: lv, msg: msg}); if (lv > level) level = lv; }
    if (r.error){ r.status = "fail"; r.issues = [{lv: 2, msg: t(r.error)}]; return; }
    var sSr = parseInt($("sSr").value, 10) || 0, sCh = parseInt($("sCh").value, 10) || 0, sFmt = $("sFmt").value, sBit = parseInt($("sBit").value, 10) || 0;
    var sMin = num("sMin"), sMax = num("sMax"), sLead = num("sLead"), sTrail = num("sTrail");
    var tClip = num("tClip"), tPeak = num("tPeak"), tNoise = num("tNoise"), tSnr = num("tSnr");
    if (tClip === null) tClip = 0.05; if (tPeak === null) tPeak = -12; if (tNoise === null) tNoise = -50; if (tSnr === null) tSnr = 25;
    if (sSr && r.sr !== sSr) add(2, fmtMsg("i_sr", r.sr, sSr));
    if (sCh && r.ch !== sCh) add(2, fmtMsg("i_ch", r.ch, sCh));
    if (sFmt && r.fmt !== sFmt) add(2, fmtMsg("i_fmt", r.fmt, sFmt));
    if (sBit && r.bits && r.bits !== sBit) add(2, fmtMsg("i_bit", r.bits, sBit));
    if (sMin !== null && r.dur < sMin) add(2, fmtMsg("i_min", sMin, ""));
    if (sMax !== null && r.dur > sMax) add(2, fmtMsg("i_max", sMax, ""));
    if (r.dur < 0.3) add(2, t("i_short"));
    if (r.peak < -60){ add(2, t("i_silent")); }
    else {
      if (r.clipPct > tClip) add(r.clipPct > tClip * 10 ? 2 : 1, fmtMsg("i_clip", round(r.clipPct, 2), ""));
      if (r.peak < tPeak) add(r.peak < tPeak - 18 ? 2 : 1, fmtMsg("i_peak", round(r.peak, 1), ""));
      if (r.nospeech) add(1, t("i_nospeech"));
      else {
        if (r.noise > tNoise) add(r.noise > tNoise + Math.abs(tNoise) * 0.2 ? 2 : 1, fmtMsg("i_noise", round(r.noise, 1), ""));
        if (r.snr !== null && r.snr < tSnr) add(r.snr < tSnr / 2 ? 2 : 1, fmtMsg("i_snr", round(r.snr, 1), ""));
        if (sLead !== null && r.lead < sLead) add(2, fmtMsg("i_lead", round(r.lead, 2), sLead));
        if (sTrail !== null && r.trail < sTrail) add(2, fmtMsg("i_trail", round(r.trail, 2), sTrail));
      }
    }
    if (r.fake) add(sCh === 2 ? 1 : 1, t("i_fake"));
    if (r.dc > 0.02) add(1, t("i_dc"));
    if (dupOf) add(1, fmtMsg("i_dup", dupOf, ""));
    r.issues = iss; r.status = level === 2 ? "fail" : level === 1 ? "warn" : "ok";
  }
  function evaluateAll(){
    var seen = {};
    jobs.forEach(function(j){
      if (!j.res) return;
      var dup = null;
      if (j.res.hash){ if (seen[j.res.hash]) dup = seen[j.res.hash]; else seen[j.res.hash] = j.res.name; }
      evaluate(j.res, dup);
    });
  }

  /* ---------- UI ---------- */
  function esc(s){ return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function mmss(x){ if (x == null) return "—"; return x < 60 ? round(x, 2) + "s" : Math.floor(x / 60) + ":" + ("0" + Math.floor(x % 60)).slice(-2); }
  function renderAll(){
    var rows = $("rows"), html = "", cnt = {ok: 0, warn: 0, fail: 0}, done = 0;
    jobs.forEach(function(j){
      var r = j.res;
      if (!r){ html += '<tr><td colspan="14">' + esc(j.file.name) + " …</td></tr>"; return; }
      done++; cnt[r.status]++;
      var isi = r.issues.length ? r.issues.map(function(x){ return (x.lv === 2 ? "✖ " : "⚠ ") + esc(x.msg); }).join("<br>") : esc(t("none"));
      var n = function(x, d, u){ return x == null || x === undefined ? "—" : '<span class="num">' + round(x, d) + (u || "") + "</span>"; };
      html += "<tr><td class=\"st " + r.status + "\">" + t(r.status) + "</td><td class=\"name\" title=\"" + esc(r.name) + "\">" + esc(r.name) + "</td>" +
        "<td>" + (r.error ? "—" : esc(r.fmt.toUpperCase()) + (r.bits ? " " + r.bits + "b" : "")) + "</td>" +
        "<td>" + (r.sr ? '<span class="num">' + r.sr + "</span>" : "—") + "</td><td>" + (r.ch || "—") + "</td><td>" + (r.dur != null ? mmss(r.dur) : "—") + "</td>" +
        "<td>" + n(r.peak, 1) + "</td><td>" + n(r.rms, 1) + "</td><td>" + n(r.clipPct, 2) + "</td><td>" + n(r.noise, 1) + "</td><td>" + n(r.snr, 1) + "</td>" +
        "<td>" + n(r.lead, 2, "s") + "</td><td>" + n(r.trail, 2, "s") + "</td><td class=\"issues\">" + isi + "</td></tr>";
    });
    rows.innerHTML = html;
    $("tw").hidden = !jobs.length;
    var sum = $("sum");
    if (done){
      sum.hidden = false;
      sum.innerHTML = '<span class="pill ok">' + t("ok") + ": " + cnt.ok + '</span><span class="pill warn">' + t("warn") + ": " + cnt.warn + '</span><span class="pill fail">' + t("fail") + ": " + cnt.fail + "</span>";
    } else sum.hidden = true;
    $("count").textContent = jobs.length ? jobs.length + " " + t("files") : "";
    $("go").disabled = !jobs.length || running;
    $("csv").disabled = !done;
    $("clear").disabled = !jobs.length || running;
  }

  function addFiles(list){
    Array.prototype.forEach.call(list, function(f){ jobs.push({file: f, res: null}); });
    renderAll();
  }
  async function runAll(){
    if (running) return;
    running = true; $("go").disabled = true; $("clear").disabled = true;
    var bar = $("bar"), fill = bar.firstElementChild; bar.hidden = false; fill.style.width = "0";
    $("count").textContent = t("busy");
    for (var i = 0; i < jobs.length; i++){
      var j = jobs[i];
      if (!j.res){
        try{ j.res = await analyze(j.file); }
        catch(e){ console.error(e); j.res = {name: j.file.name, error: "decodefail"}; }
        evaluateAll(); renderAll();
      }
      fill.style.width = Math.round((i + 1) / jobs.length * 100) + "%";
      await new Promise(function(r){ setTimeout(r, 0); });
    }
    running = false; bar.hidden = true;
    evaluateAll(); renderAll();
    $("count").textContent = t("done") + " · " + jobs.length + " " + t("files");
  }
  function csvCell(s){ s = String(s == null ? "" : s); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
  function exportCsv(){
    var head = ["status","file","format","bits","sample_rate","channels","duration_s","peak_dbfs","rms_dbfs","clipped_pct","noise_dbfs","snr_db","lead_silence_s","trail_silence_s","sha256","notes"];
    var out = [head.join(",")];
    jobs.forEach(function(j){
      var r = j.res; if (!r) return;
      var m = function(x, d){ return x == null ? "" : round(x, d); };
      out.push([r.status, r.name, r.fmt || "", r.bits || "", r.sr || "", r.ch || "", m(r.dur, 2), m(r.peak, 1), m(r.rms, 1), m(r.clipPct, 3), m(r.noise, 1), m(r.snr, 1), m(r.lead, 2), m(r.trail, 2), r.hash || "",
        r.issues.map(function(x){ return x.msg; }).join(" | ")].map(csvCell).join(","));
    });
    var blob = new Blob(["﻿" + out.join("\r\n")], {type: "text/csv;charset=utf-8"});
    var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "sayvoi-quality-report.csv";
    document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }

  var drop = $("drop"), inp = $("file");
  drop.addEventListener("click", function(){ inp.click(); });
  drop.addEventListener("keydown", function(e){ if (e.key === "Enter" || e.key === " "){ e.preventDefault(); inp.click(); } });
  ["dragenter","dragover"].forEach(function(ev){ drop.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.add("over"); }); });
  ["dragleave","drop"].forEach(function(ev){ drop.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.remove("over"); }); });
  drop.addEventListener("drop", function(e){ if (e.dataTransfer && e.dataTransfer.files.length) addFiles(e.dataTransfer.files); });
  inp.addEventListener("change", function(){ if (inp.files.length) addFiles(inp.files); inp.value = ""; });
  $("go").addEventListener("click", runAll);
  $("csv").addEventListener("click", exportCsv);
  $("clear").addEventListener("click", function(){ jobs = []; $("bar").hidden = true; renderAll(); });
  $("langBtn").addEventListener("click", function(){ lang = lang === "ar" ? "en" : "ar"; try{ localStorage.setItem("sayvoi_lang", lang); }catch(e){} applyLang(); });
  Array.prototype.forEach.call(document.querySelectorAll("input,select"), function(el){
    el.addEventListener("change", function(){ if (el.id !== "file"){ evaluateAll(); renderAll(); } });
  });
  applyLang();
})();
</script>
</body>
