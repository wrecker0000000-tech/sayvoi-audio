var $=function(i){return document.getElementById(i);};
var L="en";try{if(localStorage.getItem("sayvoi_lang")==="ar")L="ar";}catch(e){}
var book=null,fileName="",rows=[],outParts=[];

function colName(i){var s="";i++;while(i>0){var m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26);}return s;}
function detect(rows){
 var cols=0,r=rows.slice(0,300);r.forEach(function(x){if(x.length>cols)cols=x.length;});
 var best={score:0,sc:0,nc:-1,hdr:false};
 for(var c=0;c<cols;c++){
  var vals=[],num=0;
  r.forEach(function(x){var v=String(x[c]==null?"":x[c]).trim();if(v){vals.push(v);if(/^\d+$/.test(v))num++;}});
  if(vals.length<1)continue;
  if(num/vals.length>0.8&&vals.length>1)continue;
  var seen={},d=0,len=0;vals.forEach(function(v){if(!seen[v]){seen[v]=1;d++;}len+=v.length;});
  var sc=d*Math.min(len/vals.length,60);
  if(sc>best.score)best={score:sc,sc:c,nc:-1,hdr:false};}
 if(best.score>0){
  for(var c2=0;c2<best.sc;c2++){
   var v2=[],n2=0;r.forEach(function(x,i){if(i===0)return;var v=String(x[c2]==null?"":x[c2]).trim();if(v){v2.push(v);if(/^\d+$/.test(v))n2++;}});
   if(v2.length>1&&n2/v2.length>0.9){best.nc=c2;var h0=String(r[0]&&r[0][c2]!=null?r[0][c2]:"").trim();best.hdr=!/^\d+$/.test(h0);break;}}}
 return best;}
function setSource(sheets,name){
 book={sheets:sheets,name:name};fileName=name;
 var sel=$("sheet");sel.innerHTML="";
 var bi=0,bs=-1;
 sheets.forEach(function(s,i){var o=document.createElement("option");o.value=i;o.textContent=s.name;sel.appendChild(o);var d=detect(s.rows);if(d.score>bs){bs=d.score;bi=i;}});
 sel.value=String(bi);
 $("cfg").style.display="block";$("res").style.display="none";
 loadSheet();}
function loadSheet(){
 var sh=book.sheets[parseInt($("sheet").value,10)||0];rows=sh.rows;
 var cols=0;rows.slice(0,200).forEach(function(r){if(r.length>cols)cols=r.length;});
 if(!cols)cols=1;
 var sc=$("scol"),nc=$("ncol");sc.innerHTML="";nc.innerHTML="";
 var o=document.createElement("option");o.value="-1";o.textContent=T[L].auto;nc.appendChild(o);
 for(var i=0;i<cols;i++){
  var a=document.createElement("option");a.value=i;a.textContent=T[L].colN+colName(i);sc.appendChild(a);
  var b=document.createElement("option");b.value=i;b.textContent=T[L].colN+colName(i);nc.appendChild(b);}
 var dt=detect(rows);sc.value=String(dt.sc);nc.value=String(dt.nc);$("hdr").checked=dt.hdr;
 $("srcInfo").textContent=T[L].src+fileName+" · "+sh.name+" · "+rows.length+T[L].rowsW;
 prev();}
function prev(){
 var t=$("prev"),h="";
 rows.slice(0,6).forEach(function(r){h+="<tr>";var n=Math.max(r.length,1);for(var i=0;i<Math.min(n,6);i++)h+="<td>"+esc(r[i]==null?"":r[i])+"</td>";h+="</tr>";});
 t.innerHTML=h;}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

function parseText(text){
 text=text.replace(/^﻿/,"");
 var lines=text.split(/\r\n|\n|\r/),tabs=lines.some(function(l){return l.indexOf("\t")>-1;}),semi=!tabs&&lines.slice(0,5).every(function(l){return l.indexOf(";")>-1;}),r=[];
 lines.forEach(function(l){if(tabs)r.push(l.split("\t"));else if(semi)r.push(l.split(";"));else r.push([l]);});
 return [{name:"Text",rows:r}];}
function parseCsv(text){
 if(!window.XLSX)return parseText(text);
 try{var wb=XLSX.read(text.replace(/^﻿/,""),{type:"string"});return wbToSheets(wb);}catch(e){return parseText(text);}}
function wbToSheets(wb){
 return wb.SheetNames.map(function(n){var a=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false,defval:"",blankrows:false});return {name:n,rows:a};});}
function readFile(f){
 var ext=(/\.([A-Za-z0-9]+)$/.exec(f.name)||[,""])[1].toLowerCase(),rd=new FileReader();
 if(ext==="xlsx"||ext==="xls"){
  if(!window.XLSX){status(T[L].errLib);return;}
  rd.onload=function(){try{setSource(wbToSheets(XLSX.read(new Uint8Array(rd.result),{type:"array"})),f.name);status("");}catch(e){status(T[L].errX);}};
  rd.readAsArrayBuffer(f);
 }else{
  rd.onload=function(){try{var t=String(rd.result||"");setSource(ext==="csv"?parseCsv(t):parseText(t),f.name);status("");}catch(e){status(T[L].errX);}};
  rd.readAsText(f,"utf-8");}}
function status(m){$("srcInfo").textContent=m;}

function wc(s){return s.split(/\s+/).filter(Boolean).length;}
function build(){
 var sc=parseInt($("scol").value,10)||0,nc=parseInt($("ncol").value,10),
     pad=parseInt($("pad").value,10)||3,start=parseInt($("start").value,10),sep=$("sep").value,
     minw=parseInt($("minw").value,10)||0,maxw=parseInt($("maxw").value,10)||0,
     mode=$("mode").value,ext=$("ext").value,chunk=parseInt($("chunk").value,10)||0,hdr=$("hdr").checked,dedup=$("dedup").checked,restart=$("restart").checked;
 if(isNaN(start))start=1;
 var items=[],seen={},skipped=0,dig=0;
 rows.forEach(function(r,i){
  if(hdr&&i===0)return;
  var s=String(r[sc]==null?"":r[sc]).replace(/[‎‏‪-‮]/g,"").replace(/\s+/g," ").trim();
  if(!s)return;
  var w=wc(s);
  if((minw&&w<minw)||(maxw&&w>maxw)){skipped++;return;}
  if(dedup){if(seen[s]){skipped++;return;}seen[s]=1;}
  var num=nc>=0?String(r[nc]==null?"":r[nc]).trim():null;
  items.push({s:s,n:num,row:r});
  if(/[0-9٠-٩A-Za-z]/.test(s))dig++;});
 function fmt(n){var x=String(n);while(x.length<pad)x="0"+x;return x;}
 function numFor(it,k){
  if(it.n!==null&&it.n!==""){return /^\d+$/.test(it.n)?fmt(parseInt(it.n,10)):it.n;}
  return fmt(start+k);}
 var parts=[];
 if(chunk>0){for(var p=0;p<items.length;p+=chunk)parts.push(items.slice(p,p+chunk));}else parts=[items];
 outParts=parts.map(function(part,pi){
  return part.map(function(it,k){
   var idx=(restart||chunk===0)?k:pi*chunk+k;
   var nm=numFor(it,idx);
   if(mode==="cols"){
    var cells=it.row.map(function(c){return String(c==null?"":c).replace(/\s+/g," ").trim();});
    while(cells.length&&cells[cells.length-1]==="")cells.pop();
    if(nc>=0)cells[nc]=nm;else cells.unshift(nm);
    return cells.join("\t");}
   if(mode==="file")return nm+"."+ext;
   if(mode==="filesent")return nm+"."+ext+"\t"+it.s;
   return nm+sep+it.s;}).join("\r\n");});
 return {count:items.length,skipped:skipped,dig:dig,files:parts.length};}

function showRes(r){
 var t=T[L];$("res").style.display="block";
 if(!r.count){$("stats").innerHTML='<div class="stat bad">'+t.none+'</div>';$("outp").value="";$("parts").innerHTML="";return;}
 $("stats").innerHTML='<div class="stat">'+t.st+'<strong>'+r.count+'</strong>'+(r.files>1?' · '+t.stFiles+'<strong>'+r.files+'</strong>':'')+'</div>'+
  (r.skipped?'<div class="stat">'+t.stSkip+'<strong>'+r.skipped+'</strong></div>':'')+
  (r.dig?'<div class="stat bad">'+t.stDig+'<strong>'+r.dig+'</strong></div>':'');
 $("outp").value=outParts.length>1?outParts[0]:outParts[0];
 var h="";
 if(outParts.length>1){outParts.forEach(function(p,i){h+='<a href="#" data-p="'+i+'">'+t.part+(i+1)+' ↓</a>';});}
 $("parts").innerHTML=h;
}
function dlText(text,name){var b=new Blob(["﻿"+text],{type:"text/plain;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();document.body.removeChild(a);}
function baseName(){return (fileName||"sentences").replace(/\.[^.]+$/,"").replace(/[^\w؀-ۿ\-]+/g,"_")||"sentences";}

$("go").addEventListener("click",function(){showRes(build());});
$("dl").addEventListener("click",function(){
 if(outParts.length>1){dlText(outParts[0],baseName()+"_part1.txt");return;}
 dlText($("outp").value,baseName()+"_recording.txt");});
$("parts").addEventListener("click",function(e){var p=e.target.getAttribute&&e.target.getAttribute("data-p");if(p===null||p===undefined)return;e.preventDefault();dlText(outParts[+p],baseName()+"_part"+(+p+1)+".txt");});
$("copy").addEventListener("click",function(){var v=outParts.length>1?outParts[0]:$("outp").value,b=this,ok=function(){b.textContent="✓";setTimeout(function(){b.textContent=T[L].copy;},1200);};
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(v).then(ok,function(){});else{$("outp").select();try{document.execCommand("copy");}catch(e){}ok();}});
$("sheet").addEventListener("change",loadSheet);
$("usePaste").addEventListener("click",function(){var v=$("paste").value;if(!v.trim())return;setSource(parseText(v),"pasted");});
$("drop").addEventListener("click",function(){$("fi").click();});
$("drop").addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();$("fi").click();}});
$("fi").addEventListener("change",function(){if(this.files[0])readFile(this.files[0]);this.value="";});
["dragenter","dragover"].forEach(function(n){$("drop").addEventListener(n,function(e){e.preventDefault();this.classList.add("over");});});
["dragleave","drop"].forEach(function(n){$("drop").addEventListener(n,function(e){e.preventDefault();this.classList.remove("over");});});
$("drop").addEventListener("drop",function(e){var f=e.dataTransfer&&e.dataTransfer.files[0];if(f)readFile(f);});
$("langBtn").addEventListener("click",function(){L=L==="en"?"ar":"en";try{localStorage.setItem("sayvoi_lang",L);}catch(e){}applyLang();});

function applyLang(){
 var t=T[L];document.documentElement.lang=L;document.documentElement.dir=t.dir;
 $("nav").innerHTML=t.nav;$("foot").innerHTML=t.foot;$("langBtn").textContent=t.btn;
 var a=document.querySelectorAll("[data-i]");for(var i=0;i<a.length;i++){var k=a[i].getAttribute("data-i");if(k==="beta")a[i].innerHTML=t[k];else a[i].textContent=t[k];}
 var h=document.querySelectorAll("[data-h]");for(var j=0;j<h.length;j++)h[j].innerHTML=t[h[j].getAttribute("data-h")];
 var o=document.querySelectorAll("option[data-k]");for(var m=0;m<o.length;m++)o[m].textContent=t[o[m].getAttribute("data-k")];
 $("usePaste").textContent=t.usePaste;$("go").textContent=t.go;$("dl").textContent=t.dl;$("copy").textContent=t.copy;
 document.title=L==="ar"?"قائمة الجمل للتسجيل | Sayvoi":"Sentence List for Recording (Test) | Sayvoi";
 if(book){var cs=$("scol").value,cn=$("ncol").value;loadSheet();$("scol").value=cs;$("ncol").value=cn;}
}
applyLang();
})();
</script>
</body>
