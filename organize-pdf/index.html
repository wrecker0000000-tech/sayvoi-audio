/* ---------- app ---------- */
var BASE="/organize-pdf/lib/",libs={},files=[],pages=[],hist=[],thumbs={},tq=[],tbusy=false,busy=false,nextId=1;
function show(txt,bad){var m=$("msg");m.className="scan "+(bad?"bad":"ok");m.style.display="block";m.style.direction=T[L].dir;m.textContent=txt;}
function hide(){$("msg").style.display="none";}
function fmt(s,o){for(var k in o)s=s.replace("{"+k+"}",o[k]);return s;}
function loadScript(src){
 if(libs[src])return libs[src];
 libs[src]=new Promise(function(res,rej){var s=document.createElement("script");s.src=src;s.onload=res;s.onerror=function(){libs[src]=null;rej(new Error("lib"));};document.head.appendChild(s);});
 return libs[src];
}
function ensurePdfjs(){return loadScript(BASE+"pdf.min.js").then(function(){window.pdfjsLib.GlobalWorkerOptions.workerSrc=BASE+"pdf.worker.min.js";});}
function ensureLib(){return loadScript(BASE+"pdf-lib.min.js");}
function snap(){hist.push(JSON.stringify(pages));if(hist.length>60)hist.shift();}
/* ----- thumbnails ----- */
function queueThumb(f,p){
 var k=f+":"+p;if(thumbs[k]!==undefined)return;thumbs[k]=null;tq.push([f,p]);runThumbs();
}
function runThumbs(){
 if(tbusy||!tq.length)return;tbusy=true;
 var j=tq.shift(),fo=files[j[0]];
 if(!fo){tbusy=false;return runThumbs();}
 fo.doc.getPage(j[1]+1).then(function(pg){
  var v0=pg.getViewport({scale:1}),sc=200/Math.max(v0.width,v0.height),v=pg.getViewport({scale:sc});
  var c=document.createElement("canvas");c.width=Math.round(v.width);c.height=Math.round(v.height);
  var ctx=c.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,c.width,c.height);
  return pg.render({canvasContext:ctx,viewport:v}).promise.then(function(){
   thumbs[j[0]+":"+j[1]]=c.toDataURL("image/jpeg",0.7);fillThumbs();
  });
 }).catch(function(){thumbs[j[0]+":"+j[1]]="";}).then(function(){tbusy=false;runThumbs();});
}
function fillThumbs(){
 var im=$("grid").querySelectorAll("img[data-k]");
 for(var i=0;i<im.length;i++){var u=thumbs[im[i].getAttribute("data-k")];if(u&&im[i].getAttribute("src")!==u)im[i].src=u;}
}
/* ----- grid ----- */
var dragI=-1;
function render(){
 var g=$("grid");g.innerHTML="";
 pages.forEach(function(p,i){
  var t=T[L],fo=files[p.f],d=document.createElement("div");
  d.className="pc"+(p.sel?" on":"");d.draggable=true;
  var earlier=t.dir==="rtl"?"▶":"◀",later=t.dir==="rtl"?"◀":"▶";
  d.innerHTML='<label class="ck"><input type="checkbox"'+(p.sel?" checked":"")+' aria-label="'+t.tS+'"></label>'+
   '<div class="th"><img data-k="'+p.f+":"+p.p+'" alt="" draggable="false" style="transform:rotate('+p.rot+'deg)"></div>'+
   '<div class="nm"><b>'+(i+1)+'</b> <span>'+esc(fo?fo.tag:"")+" · "+t.pgn+" "+(p.p+1)+'</span></div>'+
   '<div class="pb"><button type="button" data-a="l" title="'+t.tL+'" aria-label="'+t.tL+'">⟲</button><button type="button" data-a="r" title="'+t.tR+'" aria-label="'+t.tR+'">⟳</button>'+
   '<button type="button" data-a="e" title="'+t.tE+'" aria-label="'+t.tE+'">'+earlier+'</button><button type="button" data-a="n" title="'+t.tLt+'" aria-label="'+t.tLt+'">'+later+'</button><button type="button" data-a="d" title="'+t.tD+'" aria-label="'+t.tD+'">✕</button></div>';
  d.setAttribute("data-i",i);g.appendChild(d);queueThumb(p.f,p.p);
 });
 fillThumbs();count();renderFiles();
 $("work").style.display=pages.length?"":"none";
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");}
function count(){var s=0;pages.forEach(function(p){if(p.sel)s++;});$("cnt").textContent=fmt(T[L].cnt,{n:pages.length,s:s});}
function renderFiles(){
 var b=$("files"),h="";
 files.forEach(function(f,i){if(!f)return;h+='<div class="fchip"><span class="tg">'+esc(f.tag)+'</span><span class="fn">'+esc(f.name)+'</span><span class="fp">'+f.n+" "+T[L].pg+'</span><button type="button" data-rm="'+i+'" aria-label="'+T[L].rmF+'" title="'+T[L].rmF+'">✕</button></div>';});
 b.innerHTML=h;
}
$("files").addEventListener("click",function(e){
 var b=e.target.closest("button[data-rm]");if(!b)return;var i=+b.getAttribute("data-rm");
 snap();files[i]=null;pages=pages.filter(function(p){return p.f!==i;});render();
});
$("grid").addEventListener("click",function(e){
 var d=e.target.closest(".pc");if(!d)return;var i=+d.getAttribute("data-i"),b=e.target.closest("button[data-a]");
 if(e.target.closest(".ck")){setTimeout(function(){pages[i].sel=d.querySelector("input").checked;d.classList.toggle("on",pages[i].sel);count();},0);return;}
 if(!b)return;var a=b.getAttribute("data-a");snap();
 if(a==="l")pages[i].rot=(pages[i].rot+270)%360;
 else if(a==="r")pages[i].rot=(pages[i].rot+90)%360;
 else if(a==="d")pages.splice(i,1);
 else if(a==="e"&&i>0){var x=pages[i];pages[i]=pages[i-1];pages[i-1]=x;}
 else if(a==="n"&&i<pages.length-1){var y=pages[i];pages[i]=pages[i+1];pages[i+1]=y;}
 render();
});
$("grid").addEventListener("dragstart",function(e){var d=e.target.closest&&e.target.closest(".pc");if(!d)return;dragI=+d.getAttribute("data-i");try{e.dataTransfer.setData("text/plain","p");e.dataTransfer.effectAllowed="move";}catch(x){}});
$("grid").addEventListener("dragover",function(e){if(dragI>=0)e.preventDefault();});
$("grid").addEventListener("drop",function(e){
 if(dragI<0)return;e.preventDefault();e.stopPropagation();var d=e.target.closest(".pc");if(!d){dragI=-1;return;}
 var to=+d.getAttribute("data-i");if(to!==dragI){snap();var m=pages.splice(dragI,1)[0];pages.splice(to,0,m);render();}dragI=-1;
});
$("grid").addEventListener("dragend",function(){dragI=-1;});
function selCount(){return pages.filter(function(p){return p.sel;}).length;}
$("bAll").addEventListener("click",function(){pages.forEach(function(p){p.sel=true;});render();});
$("bNone").addEventListener("click",function(){pages.forEach(function(p){p.sel=false;});render();});
function rotSel(a){if(!selCount()){show(T[L].errNoSel,true);return;}hide();snap();pages.forEach(function(p){if(p.sel)p.rot=(p.rot+a)%360;});render();}

$("bRR").addEventListener("click",function(){rotSel(90);});

/* ----- open files ----- */
function openFiles(list){
 list=Array.prototype.slice.call(list||[]);if(!list.length)return;
 var bad=list.filter(function(f){return !/\.pdf$/i.test(f.name)&&f.type!=="application/pdf";});
 if(bad.length&&bad.length===list.length){show(T[L].errType,true);return;}
 list=list.filter(function(f){return bad.indexOf(f)<0;});
 show(T[L].busy,false);
 var chain=ensurePdfjs().catch(function(){show(T[L].errLib,true);throw 0;}),k=0;
 list.forEach(function(f,idx){chain=chain.then(function(){
  show(fmt(T[L].load,{a:idx+1,b:list.length}),false);
  if(f.size>300*1024*1024){show(fmt(T[L].errBig,{f:f.name}),true);return;}
  return new Promise(function(res){var fr=new FileReader();fr.onerror=function(){show(fmt(T[L].errRead,{f:f.name}),true);res();};
   fr.onload=function(){
    var bytes=new Uint8Array(fr.result);
    window.pdfjsLib.getDocument({data:bytes.slice(0)}).promise.then(function(doc){
     var id=files.length,tag="F"+(nextId++);
     files.push({name:f.name,bytes:bytes,doc:doc,n:doc.numPages,tag:tag,lib:null});
     snap();for(var p=0;p<doc.numPages;p++)pages.push({f:id,p:p,rot:0,sel:false});
     res();
    }).catch(function(e){show(fmt(e&&e.name==="PasswordException"?T[L].errPass:T[L].errRead,{f:f.name}),true);res();});
   };fr.readAsArrayBuffer(f);});
 });});
 chain.then(function(){if(pages.length){if($("msg").className.indexOf("bad")<0)hide();render();}}).catch(function(){});
}

document.addEventListener("dragover",function(e){if(dragI<0&&e.dataTransfer&&e.dataTransfer.types&&Array.prototype.indexOf.call(e.dataTransfer.types,"Files")>=0)e.preventDefault();});
document.addEventListener("drop",function(e){if(dragI<0&&e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files.length){e.preventDefault();openFiles(e.dataTransfer.files);}});
/* ----- export ----- */
function buildPdf(list){
 return ensureLib().then(function(){
  var PD=window.PDFLib.PDFDocument,out,need={},ids;
  list.forEach(function(p){need[p.f]=1;});ids=Object.keys(need);
  return PD.create().then(function(o){
   out=o;var ch=Promise.resolve();
   ids.forEach(function(id){ch=ch.then(function(){if(files[id].lib)return;return PD.load(files[id].bytes).then(function(d){files[id].lib=d;});});});
   return ch;
  }).then(function(){
   var ch=Promise.resolve(),map={};
   ids.forEach(function(id){
    var u=[],seen={};list.forEach(function(p){if(String(p.f)===id&&!seen[p.p]){seen[p.p]=1;u.push(p.p);}});
    ch=ch.then(function(){return out.copyPages(files[id].lib,u);}).then(function(r){u.forEach(function(pi,k){map[id+":"+pi]=r[k];});});
   });
   return ch.then(function(){
    list.forEach(function(p){
     var pg=map[p.f+":"+p.p],a=pg.getRotation().angle||0;
     pg.setRotation(window.PDFLib.degrees((a+p.rot)%360));out.addPage(pg);
    });
    return out.save();
   });
  });
 });
}
function saveBlob(blob,name){
 var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
 setTimeout(function(){URL.revokeObjectURL(a.href);document.body.removeChild(a);},4000);
}
function baseName(){for(var i=0;i<files.length;i++)if(files[i])return files[i].name.replace(/\.pdf$/i,"");return "document";}
function doSingle(list,suffix){
 if(busy)return;if(!list.length){show(T[L].errEmpty,true);return;}
 busy=true;show(T[L].busy,false);
 buildPdf(list).then(function(b){saveBlob(new Blob([b],{type:"application/pdf"}),baseName()+suffix+".pdf");show(T[L].done,false);})
 .catch(function(e){show(e&&e.message==="lib"?T[L].errLib:T[L].errOut,true);}).then(function(){busy=false;});
}
function parseRange(s){
 s=s.replace(/[٠-٩]/g,function(c){return c.charCodeAt(0)-1632;}).replace(/[۰-۹]/g,function(c){return c.charCodeAt(0)-1776;});
 var parts=s.split(/[,،;\s]+/).filter(Boolean),out=[],i,m;
 if(!parts.length)return null;
 for(i=0;i<parts.length;i++){
  m=/^(\d+)(?:\s*[-–]\s*(\d+))?$/.exec(parts[i]);if(!m)return null;
  var a=+m[1],b=m[2]?+m[2]:a;if(a<1||b<a||b>pages.length)return null;
  for(var k=a;k<=b;k++)out.push(pages[k-1]);
 }
 return out;
}
$("oAll").addEventListener("click",function(){doSingle(pages,"-merged");});
$("oSel").addEventListener("click",function(){var l=pages.filter(function(p){return p.sel;});if(!l.length){show(T[L].errNoSel,true);return;}doSingle(l,"-selected");});
$("oRng").addEventListener("click",function(){var l=parseRange($("rng").value);if(!l){show(T[L].errRange,true);return;}doSingle(l,"-pages");});
$("oZip").addEventListener("click",function(){
 if(busy)return;var n=parseInt($("nper").value,10);if(!n||n<1){show(T[L].errN,true);return;}if(!pages.length){show(T[L].errEmpty,true);return;}
 busy=true;show(T[L].busy,false);
 var parts=[];for(var i=0;i<pages.length;i+=n)parts.push(pages.slice(i,i+n));
 var zip,bn=baseName(),pad=String(parts.length).length;
 loadScript(BASE+"jszip.min.js").then(function(){
  zip=new window.JSZip();var ch=Promise.resolve();
  parts.forEach(function(l,k){ch=ch.then(function(){show(fmt(T[L].load,{a:k+1,b:parts.length}),false);return buildPdf(l);}).then(function(b){
   var num=String(k+1);while(num.length<pad)num="0"+num;
   zip.file(bn+"-part-"+num+".pdf",b);
  });});
  return ch;
 }).then(function(){return zip.generateAsync({type:"blob"});}).then(function(blob){saveBlob(blob,bn+"-split.zip");show(T[L].done,false);})
 .catch(function(e){show(e&&e.message==="lib"?T[L].errLib:T[L].errOut,true);}).then(function(){busy=false;});
});
