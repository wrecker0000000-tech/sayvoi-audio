 sents.forEach(function(s,i){var d=document.createElement("div");d.className="ritem"+(i===idx?" cur":"");d.setAttribute("data-g",i);

function go(i){if(!sents.length||recording)return;stopSpeak();idx=Math.max(0,Math.min(sents.length-1,i));lsSet("pt_idx",String(idx));renderAll();}
/* ---------- voices ---------- */
function allVoices(){try{return speechSynthesis.getVoices()||[];}catch(e){return [];}}
function accVoices(){var code=ACC==="uk"?"en-gb":"en-us";return allVoices().filter(function(v){return v.lang&&v.lang.replace("_","-").toLowerCase()===code;});}
function fillVoices(){
 if(!TTS)return;var sel=$("voice"),cur=lsGet("pt_voice_"+ACC,""),vs=accVoices();sel.innerHTML="";
 vs.forEach(function(v){var o=document.createElement("option");o.value=v.voiceURI||v.name;o.textContent=v.name;sel.appendChild(o);});
 var f=false;for(var i=0;i<sel.options.length;i++){if(sel.options[i].value===cur){sel.value=cur;f=true;}}
 var n=$("voiceNote"),t=T[L];
 if(!vs.length){var o2=document.createElement("option");o2.value="";o2.textContent="—";sel.appendChild(o2);n.textContent=t.vNone;}
 else n.textContent=vs.length+t.vCount;}
function curVoice(){var vs=accVoices(),v=$("voice").value;for(var i=0;i<vs.length;i++){if((vs[i].voiceURI||vs[i].name)===v)return vs[i];}return vs[0]||null;}
function stopSpeak(){try{if(TTS)speechSynthesis.cancel();}catch(e){}}
function speak(){
 if(!TTS||!sents.length)return;stopSpeak();
 var u=new SpeechSynthesisUtterance(sents[idx]),v=curVoice();
 u.lang=ACC==="uk"?"en-GB":"en-US";if(v){try{u.voice=v;}catch(e){}}u.rate=RATE[SPD]||1;
 setTimeout(function(){try{speechSynthesis.speak(u);}catch(e){}},60);}
/* ---------- recording + rating ---------- */
var recording=false,stream=null,mr=null,chunks=[],rec=null,heardTxt="",player=null,srErr="";
function msg(txt,bad){var r=$("res");r.style.display="block";$("score").textContent="";$("verdict").textContent=txt;$("verdict").style.color=bad?"#d93a3a":"";$("heard").textContent="";$("resNote").textContent="";}
async function startRec(){
 if(recording||!sents.length)return;stopSpeak();
 try{stream=await navigator.mediaDevices.getUserMedia({audio:true});}catch(e){msg(T[L].errMic,true);return;}
 heardTxt="";srErr="";chunks=[];
 try{mr=new MediaRecorder(stream);mr.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data);};
  mr.onstop=function(){var b=new Blob(chunks,{type:mr.mimeType||"audio/webm"});if(b.size>800){if(recUrl[idx])URL.revokeObjectURL(recUrl[idx]);recUrl[idx]=URL.createObjectURL(b);$("mine").disabled=false;}};
  mr.start();}catch(e){mr=null;}
 var want=$("rate").checked&&SR;
 if(want){try{rec=new SR();rec.lang=ACC==="uk"?"en-GB":"en-US";rec.interimResults=true;rec.continuous=false;rec.maxAlternatives=1;
  rec.onresult=function(e){var s="";for(var i=0;i<e.results.length;i++)s+=e.results[i][0].transcript+" ";heardTxt=s.trim();};
  rec.onerror=function(e){srErr=e.error||"x";};
  rec.onend=function(){if(recording)finish();};
  rec.start();}catch(e){rec=null;srErr="x";}}
 recording=true;$("rec").textContent=T[L].stop;$("rec").classList.add("on");
 var r=$("res");r.style.display="block";$("score").textContent="";$("verdict").textContent=want?T[L].listening:"";$("verdict").style.color="";$("heard").textContent="";$("resNote").textContent="";}
function finish(){
 if(!recording)return;recording=false;
 try{if(rec)rec.stop();}catch(e){}
 try{if(mr&&mr.state!=="inactive")mr.stop();}catch(e){}
 try{if(stream)stream.getTracks().forEach(function(t){t.stop();});}catch(e){}
 stream=null;$("rec").textContent=T[L].rec;$("rec").classList.remove("on");
 var want=$("rate").checked&&SR;
 if(!want){$("res").style.display="none";return;}
 setTimeout(function(){
  var t=T[L];
  if(!heardTxt){msg(srErr&&srErr!=="no-speech"&&srErr!=="aborted"?t.errSr:t.errHeard,true);return;}
  var r=score(sents[idx],heardTxt);scores[idx]=r.pct;
  $("res").style.display="block";$("score").textContent=r.pct+"%";
  $("verdict").style.color="";$("verdict").textContent=r.pct>=90?t.s90:(r.pct>=70?t.s70:(r.pct>=50?t.s50:t.s0));
  $("heard").textContent=t.heardLbl+heardTxt;$("resNote").textContent=t.resNote;
  showSent(r);var keys=Object.keys(scores),sum=0;keys.forEach(function(k){sum+=scores[k];});
  $("avg").textContent=t.avg+Math.round(sum/keys.length)+"%"+t.avgOf+keys.length;
  $("bar").style.width=Math.round(keys.length/sents.length*100)+"%";renderList();
 },350);}
$("rec").addEventListener("click",function(){if(recording)finish();else startRec();});
$("mine").addEventListener("click",function(){var u=recUrl[idx];if(!u)return;try{if(player)player.pause();player=new Audio(u);player.play();}catch(e){}});
$("listen").addEventListener("click",speak);
$("prev").addEventListener("click",function(){go(idx-1);});
$("next").addEventListener("click",function(){go(idx+1);});
$("use").addEventListener("click",function(){var a=parse($("txt").value);if(!a.length){$("txt").focus();return;}setSents(a,false);try{$("sent").scrollIntoView({behavior:"smooth",block:"center"});}catch(e){}});
$("demo").addEventListener("click",function(){$("txt").value=T[L].demoList;setSents(parse(T[L].demoList),false);});
$("upl").addEventListener("click",function(){$("file").click();});
$("file").addEventListener("change",function(){var f=this.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){var a=parse(String(rd.result||""));if(a.length){$("txt").value=a.join("\n");setSents(a,false);}};rd.readAsText(f,"utf-8");this.value="";});
$("rv").addEventListener("toggle",renderList);
$("list").addEventListener("click",function(e){var r=e.target.closest?e.target.closest(".ritem"):null;if(r)go(+r.getAttribute("data-g"));});
$("accSeg").addEventListener("click",function(e){var a=e.target.getAttribute("data-a");if(!a)return;ACC=a;lsSet("pt_acc",a);markSeg();fillVoices();});
$("spdSeg").addEventListener("click",function(e){var s=e.target.getAttribute("data-s");if(!s)return;SPD=s;lsSet("pt_spd",s);markSeg();if(sents.length&&TTS)speak();});
$("voice").addEventListener("change",function(){lsSet("pt_voice_"+ACC,this.value);});
function markSeg(){[].forEach.call($("accSeg").children,function(b){b.classList.toggle("on",b.getAttribute("data-a")===ACC);});[].forEach.call($("spdSeg").children,function(b){b.classList.toggle("on",b.getAttribute("data-s")===SPD);});}
function saveBlob(){}
/* ---------- init ---------- */
if(TTS){try{speechSynthesis.onvoiceschanged=fillVoices;}catch(e){}}
try{var ss=JSON.parse(lsGet("pt_sents","[]"));if(Array.isArray(ss)&&ss.length){sents=ss;idx=Math.min(parseInt(lsGet("pt_idx","0"),10)||0,ss.length-1);$("txt").value=ss.join("\n");}}catch(e){}
function applyLang(){
 var t=T[L];document.documentElement.lang=L;document.documentElement.dir=t.dir;
 $("foot").innerHTML=t.foot;$("langBtn").textContent=t.btn;
 var a=document.querySelectorAll("[data-i]");for(var i=0;i<a.length;i++)a[i].textContent=t[a[i].getAttribute("data-i")];
 var h=document.querySelectorAll("[data-h]");for(var j=0;j<h.length;j++)h[j].textContent=t[h[j].getAttribute("data-h")];
 $("use").textContent=t.use;$("upl").textContent=t.upl;$("demo").textContent=t.demo;$("cnt").style.direction=t.dir;$("listen").textContent=t.listen;$("rec").textContent=recording?t.stop:t.rec;$("mine").textContent=t.mine;
 var ab=$("accSeg").children;ab[0].textContent=t.aUs;ab[1].textContent=t.aUk;
 var sb=$("spdSeg").children;sb[0].textContent=t.sSlow;sb[1].textContent=t.sNormal;sb[2].textContent=t.sFast;
 var sup=$("support"),m=[];if(!TTS)m.push(t.noTts);if(!SR)m.push(t.noSr);sup.style.display=m.length?"block":"none";sup.textContent=m.join(" ");
 document.title=L==="ar"?"تدريب النطق الإنجليزي: استمع وسجّل وقيّم | Sayvoi":"English Pronunciation Practice: Listen, Record, Score | Sayvoi";
 markSeg();fillVoices();renderAll();
}
$("langBtn").addEventListener("click",function(){L=L==="en"?"ar":"en";lsSet("sayvoi_lang",L);applyLang();});
applyLang();
})();
</script>
