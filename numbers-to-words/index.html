window.SpokenEngine=(function(){
 var EG_ONES=["صفر","واحد","اتنين","تلاتة","أربعة","خمسة","ستة","سبعة","تمانية","تسعة","عشرة","احداشر","اتناشر","تلتاشر","أربعتاشر","خمستاشر","ستاشر","سبعتاشر","تمنتاشر","تسعتاشر"];
 var EG_TENS=["","","عشرين","تلاتين","أربعين","خمسين","ستين","سبعين","تمانين","تسعين"];
 var EG_HUND=["","ميّة","ميتين","تلاتمية","أربعمية","خمسمية","ستمية","سبعمية","تمانمية","تسعمية"];
 var EG_SHORT=["","","","تلات","أربع","خمس","ست","سبع","تمن","تسع","عشر"];
 var MSA_ONES=["صفر","واحد","اثنان","ثلاثة","أربعة","خمسة","ستة","سبعة","ثمانية","تسعة","عشرة","أحد عشر","اثنا عشر","ثلاثة عشر","أربعة عشر","خمسة عشر","ستة عشر","سبعة عشر","ثمانية عشر","تسعة عشر"];

 var MSA_HUND=["","مئة","مئتان","ثلاثمئة","أربعمئة","خمسمئة","ستمئة","سبعمئة","ثمانمئة","تسعمئة"];
 var SC=[null,["ألف","ألفان","ألفين","آلاف","ألفًا"],["مليون","مليونان","مليونين","ملايين","مليونًا"],["مليار","ملياران","مليارين","مليارات","مليارًا"]];
 var EG_SC=[null,"ألف","مليون","مليار"];
 var EG_SC2=[null,"ألفين","مليونين","مليارين"];
 var DIG_EG=["صفر","واحد","اتنين","تلاتة","أربعة","خمسة","ستة","سبعة","تمانية","تسعة"];
 var DIG_MSA=["صفر","واحد","اثنان","ثلاثة","أربعة","خمسة","ستة","سبعة","ثمانية","تسعة"];
 var FEM=["","واحدة","اثنتان","ثلاث","أربع","خمس","ست","سبع","ثماني","تسع","عشر"];
 var FEMT=["إحدى عشرة","اثنتا عشرة","ثلاث عشرة","أربع عشرة","خمس عشرة","ست عشرة","سبع عشرة","ثماني عشرة","تسع عشرة"];
 var MSA_HOUR=["","الأولى","الثانية","الثالثة","الرابعة","الخامسة","السادسة","السابعة","الثامنة","التاسعة","العاشرة","الحادية عشرة","الثانية عشرة"];
 var MSA_ORD=["","الأول","الثاني","الثالث","الرابع","الخامس","السادس","السابع","الثامن","التاسع","العاشر","الحادي عشر","الثاني عشر","الثالث عشر","الرابع عشر","الخامس عشر","السادس عشر","السابع عشر","الثامن عشر","التاسع عشر","العشرون","الحادي والعشرون","الثاني والعشرون","الثالث والعشرون","الرابع والعشرون","الخامس والعشرون","السادس والعشرون","السابع والعشرون","الثامن والعشرون","التاسع والعشرون","الثلاثون","الحادي والثلاثون"];
 var MONTHS=["","يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];

 function egGroup(n){var h=Math.floor(n/100),r=n%100,p=[];if(h)p.push(EG_HUND[h]);if(r){if(r<20)p.push(EG_ONES[r]);else{var o=r%10;if(o)p.push(EG_ONES[o]);p.push(EG_TENS[Math.floor(r/10)]);}}return p.join(" و");}
 function egScale(c,s){if(c===1)return EG_SC[s];if(c===2)return EG_SC2[s];if(s===1&&c>=3&&c<=10)return EG_SHORT[c]+" تلاف";return egGroup(c)+" "+EG_SC[s];}
 function msaGroup(n,g){var h=Math.floor(n/100),r=n%100,p=[];
  if(h)p.push(h===2?(g?"مئتين":"مئتان"):MSA_HUND[h]);
  if(r){if(r<20)p.push(r===2?(g?"اثنين":"اثنان"):(r===12?(g?"اثني عشر":"اثنا عشر"):MSA_ONES[r]));
   else{var o=r%10;if(o)p.push(o===2?(g?"اثنين":"اثنان"):MSA_ONES[o]);p.push((g?MSA_TENS_G:MSA_TENS)[Math.floor(r/10)]);}}
  return p.join(" و");}
 function msaScale(c,s,g){var N=SC[s],cc=c%100;if(c===1)return N[0];if(c===2)return g?N[2]:N[1];if(c<=10)return msaGroup(c,g)+" "+N[3];
  if(c===200&&s===1)return g?"مئتي ألف":"مئتا ألف";if(cc===0)return msaGroup(c,g)+" "+N[0];if(cc>=3&&cc<=10)return msaGroup(c,g)+" "+N[3];return msaGroup(c,g)+" "+N[4];}
 function card(n,dial,gen){if(n===0)return "صفر";var g=[],x=n;while(x>0){g.unshift(x%1000);x=Math.floor(x/1000);}
  var parts=[],len=g.length;for(var i=0;i<len;i++){var c=g[i],s=len-1-i;if(!c)continue;
   parts.push(s===0?(dial==="egy"?egGroup(c):msaGroup(c,gen)):(dial==="egy"?egScale(c,s):msaScale(c,s,gen)));}
  return parts.join(" و");}
 function digitsWords(str,dial){var d=dial==="egy"?DIG_EG:DIG_MSA,out=[];for(var i=0;i<str.length;i++){var c=str.charCodeAt(i)-48;if(c>=0&&c<=9)out.push(d[c]);}return out.join(" ");}
 function numWords(str,dial,gen){
  var s=str.replace(/,/g,""),parts=s.split("."),ip=parts[0],fp=parts[1];
  if(/^0\d/.test(ip)&&fp===undefined)return digitsWords(ip,dial);
  if(ip.length>12)return digitsWords(ip,dial);
  var w=card(parseInt(ip,10),dial,gen);
  if(fp!==undefined&&fp.length)w+=(dial==="egy"?" فاصل ":" فاصلة ")+digitsWords(fp,dial);
  return w;}
 function femCount(n,sing,dual,pl){if(n===1)return sing+" واحدة";if(n===2)return dual;if(n<=10)return FEM[n]+" "+pl;if(n<20)return FEMT[n-11]+" "+sing;
  var o=n%10,t=Math.floor(n/10);return (o?(o===1?"إحدى":(o===2?"اثنتان":FEM[o]))+" و":"")+MSA_TENS[t]+" "+sing;}
 function egMin(n){if(n===1)return "دقيقة";if(n===2)return "دقيقتين";if(n<=10)return EG_SHORT[n]+" دقايق";return card(n,"egy")+" دقيقة";}
 function egSec(n){if(n===1)return "ثانية";if(n===2)return "ثانيتين";if(n<=10)return EG_SHORT[n]+" ثواني";return card(n,"egy")+" ثانية";}

 function dayPart(h24,dial){
  if(dial==="egy"){if(h24<4)return "بالليل";if(h24<6)return "الفجر";if(h24<12)return "الصبح";if(h24===12)return "الضهر";if(h24<18)return "بعد الضهر";return "بالليل";}
  if(h24<4)return "ليلًا";if(h24<6)return "فجرًا";if(h24<12)return "صباحًا";if(h24===12)return "ظهرًا";if(h24<18)return "بعد الظهر";return "مساءً";}

 function timeWords(h,mi,sec,mk,o){
  if(h>23||mi>59||(sec!==null&&sec>59))return null;
  var egy=o.dialect==="egy",m=mk?mk.toLowerCase().replace(/\./g,""):"",h24=h;
  if(m&&h>=1&&h<=12){var pm=(m==="pm"||m==="م");h24=(h%12)+(pm?12:0);}
  var withDP=o.dayPart&&(m||h24>=13||h24===0);
  var H=h24%12||12,N=H%12+1;
  function hw(x){return egy?(x===1?"واحدة":EG_ONES[x]):MSA_HOUR[x];}
  var core;
  if(mi===0)core=hw(H);
  else if(o.timeStyle==="exact"){core=hw(H)+" و"+(egy?egMin(mi):femCount(mi,"دقيقة","دقيقتان","دقائق"));}
  else if(egy){
   var map={5:hw(H)+" وخمسة",10:hw(H)+" وعشرة",15:hw(H)+" وربع",20:hw(H)+" وتلت",25:hw(H)+" ونص إلا خمسة",30:hw(H)+" ونص",35:hw(H)+" ونص وخمسة",40:hw(N)+" إلا تلت",45:hw(N)+" إلا ربع",50:hw(N)+" إلا عشرة",55:hw(N)+" إلا خمسة"};
   core=map[mi]||(hw(H)+" و"+egMin(mi));}
  else{
   var map2={5:hw(H)+" وخمس دقائق",10:hw(H)+" وعشر دقائق",15:hw(H)+" والربع",20:hw(H)+" والثلث",25:hw(H)+" والنصف إلا خمس دقائق",30:hw(H)+" والنصف",35:hw(H)+" والنصف وخمس دقائق",40:hw(N)+" إلا ثلثًا",45:hw(N)+" إلا ربعًا",50:hw(N)+" إلا عشر دقائق",55:hw(N)+" إلا خمس دقائق"};
   core=map2[mi]||(hw(H)+" و"+femCount(mi,"دقيقة","دقيقتان","دقائق"));}
  var out="الساعة "+core;
  if(sec){out+=" و"+(egy?egSec(sec):femCount(sec,"ثانية","ثانيتان","ثوانٍ"));}
  if(withDP)out+=" "+dayPart(h24,o.dialect);
  return out;}

 function dateWords(d,m,y,o){
  if(m<1||m>12||d<1||d>31||y<1000||y>9999)return null;
  if(o.dialect==="egy")return card(d,"egy")+" "+MONTHS[m]+" "+card(y,"egy");
  return MSA_ORD[d]+" من "+MONTHS[m]+" عام "+card(y,"msa",true);}

 var CUR={
  EGP:{e:["جنيه","جنيهين"],m:["جنيه","جنيهان","جنيهات","جنيهًا"],se:["قرش","قرشين","قروش"],sm:["قرش","قرشان","قروش","قرشًا"],f:0},
  SAR:{e:["ريال","ريالين"],m:["ريال","ريالان","ريالات","ريالًا"],se:["هللة","هللتين","هللات"],sm:["هللة","هللتان","هللات","هللةً"],f:1},
  AED:{e:["درهم","درهمين"],m:["درهم","درهمان","دراهم","درهمًا"],se:["فلس","فلسين","فلوس"],sm:["فلس","فلسان","فلوس","فلسًا"],f:0},
  USD:{e:["دولار","دولارين"],m:["دولار","دولاران","دولارات","دولارًا"],se:["سنت","سنتين","سنتات"],sm:["سنت","سنتان","سنتات","سنتًا"],f:0},
  EUR:{e:["يورو","يورو"],m:["يورو","يورو","يورو","يورو"],se:["سنت","سنتين","سنتات"],sm:["سنت","سنتان","سنتات","سنتًا"],f:0}};
 function amtEgy(n,nm,sub){if(n===1)return nm[0];if(n===2)return nm[1];var w=card(n,"egy");if(sub&&n>=3&&n<=10)return w+" "+nm[2];return w+" "+nm[0];}
 function amtMsa(n,nm,fem){
  if(n===1)return nm[0]+(fem?" واحدة":" واحد");
  if(n===2)return nm[1];
  if(n<=10)return (fem?FEM[n]:MSA_ONES[n])+" "+nm[2];
  var r=n%100,w=card(n,"msa",false);
  if(r===0)return w+" "+nm[0];
  if(r>=3&&r<=10)return w+" "+nm[2];
  return w+" "+nm[3];}
 function currencyWords(numStr,code,o){
  var c=CUR[code],s=numStr.replace(/,/g,""),p=s.split("."),ip=p[0],fp=(p[1]||"");
  if(ip.length>12)return null;
  var main=parseInt(ip,10),sub=fp?parseInt((fp+"00").slice(0,2),10):0,parts=[],egy=o.dialect==="egy";
  if(main>0||sub===0)parts.push(main===0?("صفر "+(egy?c.e[0]:c.m[0])):(egy?amtEgy(main,c.e,false):amtMsa(main,c.m,false)));
  if(sub>0)parts.push(egy?amtEgy(sub,c.se,true):amtMsa(sub,c.sm,false));
  return parts.join(" و");}
 function curCode(t){
  var u=t.replace(/\./g,"").toUpperCase();
  if(t==="$"||u==="USD"||/^دولار/.test(t))return "USD";
  if(t==="€"||u==="EUR"||t==="يورو")return "EUR";
  if(u==="EGP"||u==="LE"||/^جنيه/.test(t)||/^ج\.?م/.test(t))return "EGP";
  if(u==="SAR"||/^ريال/.test(t)||/^ر\.?س/.test(t))return "SAR";
  if(u==="AED"||/^درهم/.test(t)||/^دراهم/.test(t)||/^د\.?إ/.test(t))return "AED";
  return null;}
 function norm(t){
  return t.replace(/[٠-٩]/g,function(c){return String(c.charCodeAt(0)-1632);}).replace(/[۰-۹]/g,function(c){return String(c.charCodeAt(0)-1776);}).replace(/٫/g,".").replace(/٬/g,",").replace(/٪/g,"%");}

 var NUM="\\d{1,3}(?:,\\d{3})+(?:\\.\\d+)?|\\d+(?:\\.\\d+)?";
 var CURW="(?:EGP|SAR|AED|USD|EUR|L\\.?E\\.?|جنيه(?:ات|ًا)?|ج\\.م\\.?|ر\\.س\\.?|ريال(?:ات)?|د\\.إ\\.?|درهم|دراهم|دولار(?:ات)?|يورو)";
 var RE=null,REERR=null;
 try{RE=new RegExp("(?<![A-Za-z_\\d.,])(?:"+
  "(?<date>\\d{4}-\\d{1,2}-\\d{1,2}|\\d{1,2}[/.\\-]\\d{1,2}[/.\\-]\\d{4})(?!\\d)"+
  "|(?<time>\\d{1,2}:\\d{2}(?::\\d{2})?)(?:\\s*(?<mk>AM|PM|am|pm|a\\.m\\.|p\\.m\\.|ص|م)(?![A-Za-z\\u0600-\\u06FF]))?"+
  "|(?<cp>[$€]|EGP|SAR|AED|USD|EUR)\\s*(?<cpn>"+NUM+")"+
  "|(?<cn>"+NUM+")\\s*(?<cu>"+CURW+"|[$€])(?![A-Za-z\\u0600-\\u06FF])"+
  "|(?<pct>"+NUM+")\\s*%"+
  "|(?<ph>\\+\\d[\\d\\s\\-]{6,}\\d|0\\d[\\d\\s\\-]{6,}\\d|\\d{8,})(?!\\d)"+
  "|(?<neg>-)?(?<num>"+NUM+")"+
  ")","giu");}catch(e){REERR=e;}

 function convert(text,o){
  o=o||{};o.dialect=o.dialect||"egy";o.timeStyle=o.timeStyle||"nat";o.dateOrder=o.dateOrder||"dmy";o.dayPart=o.dayPart!==false;o.longDigits=o.longDigits||"digits";
  if(!RE)throw REERR||new Error("regex");
  var t=norm(text),egy=o.dialect==="egy";

  RE.lastIndex=0;
  return t.replace(RE,function(){
   var a=arguments,g=a[a.length-1],m=a[0],r=null;
   if(g.date){
