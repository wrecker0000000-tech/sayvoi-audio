function show(txt,bad){var m=$("msg");m.className="scan "+(bad?"bad":"ok");m.style.display="block";m.style.direction=T[L].dir;m.textContent=txt;}
function detect(text){
 var cands=[",",";","\t","|"],best=",",bc=-1;
 var line="",q=false,i,ch;
 for(i=0;i<text.length;i++){ch=text[i];if(ch==='"')q=!q;if(!q&&(ch==="\n"||ch==="\r"))break;line+=ch;}
 cands.forEach(function(c){var n=0,qq=false;for(var k=0;k<line.length;k++){if(line[k]==='"')qq=!qq;else if(!qq&&line[k]===c)n++;}if(n>bc){bc=n;best=c;}});
 return best;
}
function parse(text,d){
 var rows=[],row=[],f="",q=false,i=0,n=text.length,ch;
 if(text.charCodeAt(0)===0xFEFF)i=1;
 var any=false;
 for(;i<n;i++){
  ch=text[i];
  if(q){
   if(ch==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}
   else f+=ch;
  }else if(ch==='"'&&f===""){q=true;any=true;}
  else if(ch===d){row.push(f);f="";any=true;}
  else if(ch==="\n"||ch==="\r"){
   if(ch==="\r"&&text[i+1]==="\n")i++;
   row.push(f);f="";
   if(!(row.length===1&&row[0]===""&&!any))rows.push(row);
   row=[];any=false;
  }else{f+=ch;any=true;}
 }
 if(q)return null;
 if(f!==""||row.length||any){row.push(f);rows.push(row);}
 return rows;
}
var NUM=/^-?(0|[1-9]\d*)(\.\d+)?([eE][+-]?\d+)?$/;
function conv(v){
 if($("oTrim").checked)v=v.trim();
 if(v===""&&$("oNull").checked)return null;
 if($("oNum").checked&&NUM.test(v)&&v.replace(/[^0-9]/g,"").length<=15)return Number(v);
 if($("oBool").checked){var l=v.toLowerCase();if(l==="true")return true;if(l==="false")return false;}
 return v;
}

   keys.push(k);
  }
  start=1;
 }else{for(j=0;j<cols;j++)keys.push("column_"+(j+1));}
 var data=[];
 for(i=start;i<rows.length;i++){
  var r=rows[i];if(r.length!==cols)rag++;
  var vals=[];for(j=0;j<cols;j++)vals.push(conv(j<r.length?r[j]:""));
  if($("fmt").value==="arr")data.push(vals);
  else{var o={};for(j=0;j<cols;j++)o[keys[j]]=vals[j];data.push(o);}
 }
 var ind=parseInt($("ind").value,10);
 $("out").value=ind?JSON.stringify(data,null,ind):JSON.stringify(data);
 $("msg").style.display="none";

 var tb=$("pvt");tb.textContent="";
 var th=document.createElement("tr");keys.forEach(function(k){var e=document.createElement("th");e.textContent=k;th.appendChild(e);});tb.appendChild(th);
 for(i=start;i<rows.length&&i<start+10;i++){
  var tr=document.createElement("tr");
  for(j=0;j<cols;j++){var td=document.createElement("td");td.textContent=j<rows[i].length?($("oTrim").checked?rows[i][j].trim():rows[i][j]):"";tr.appendChild(td);}
  tb.appendChild(tr);
 }
 $("res").style.display="block";
 $("res").scrollIntoView({behavior:"smooth",block:"start"});
}
