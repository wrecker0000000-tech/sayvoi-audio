var BASE="/sign-pdf/lib/",libs={},doc=null,bytes=null,N=0,cur=1,items=[],sel=null,cssW=0,cssH=0,fileBase="document",renderTok=0,uid=1;
var SKEY="sayvoi_sign_sigs";
function show(txt,bad){var m=$("msg");m.className="scan "+(bad?"bad":"ok");m.style.display="block";m.style.direction=T[L].dir;m.textContent=txt;}
function hide(){$("msg").style.display="none";}
function loadScript(src){
 if(libs[src])return libs[src];
 libs[src]=new Promise(function(res,rej){var s=document.createElement("script");s.src=src;s.onload=res;s.onerror=function(){libs[src]=null;rej(new Error("lib"));};document.head.appendChild(s);});
 return libs[src];
}
function ensurePdfjs(){return loadScript(BASE+"pdf.min.js").then(function(){window.pdfjsLib.GlobalWorkerOptions.workerSrc=BASE+"pdf.worker.min.js";});}
function ensureLib(){return loadScript(BASE+"pdf-lib.min.js");}
function fmt(s,a,b){return s.replace("{a}",a).replace("{b}",b);}

/* ---- open pdf ---- */
function openFile(f){
 if(!f)return;
 if(f.size>150*1024*1024){show(T[L].errBig,true);return;}
 show(T[L].busy,false);
 var fr=new FileReader();
 fr.onerror=function(){show(T[L].errPdf,true);};
 fr.onload=function(){
  var ab=fr.result;
  ensurePdfjs().then(function(){
   return window.pdfjsLib.getDocument({data:new Uint8Array(ab.slice(0))}).promise;
  }).then(function(d){
   doc=d;bytes=ab;N=d.numPages;cur=1;items=[];sel=null;
   fileBase=f.name.replace(/\.pdf$/i,"")||"document";
   $("fname").textContent=f.name;$("work").style.display="block";
   hide();renderPage();
  }).catch(function(e){show(e&&e.message==="lib"?T[L].errLib:T[L].errPdf,true);});
 };
 fr.readAsArrayBuffer(f);
}
function renderPage(){
 if(!doc)return;
 var tok=++renderTok;
 doc.getPage(cur).then(function(page){
  if(tok!==renderTok)return;
  var pw=$("pw"),avail=Math.min(pw.parentNode.clientWidth||600,900);
  var base=page.getViewport({scale:1}),scale=avail/base.width,dpr=Math.min(window.devicePixelRatio||1,2);
  var vp=page.getViewport({scale:scale*dpr}),c=$("pc");
  c.width=Math.floor(vp.width);c.height=Math.floor(vp.height);

  pw.style.width=cssW+"px";c.style.width=cssW+"px";c.style.height=cssH+"px";
  $("ov").style.height=cssH+"px";
  page.render({canvasContext:c.getContext("2d"),viewport:vp}).promise.then(function(){if(tok===renderTok)drawOverlay();},function(){});
  drawOverlay();
  $("pg").textContent=fmt(T[L].pageOf,cur,N);
  $("prev").disabled=cur<=1;$("next").disabled=cur>=N;
 }).catch(function(){show(T[L].errPdf,true);});
}

  }

 $("sEdit").style.display=s&&s.type==="text"?"":"none";

function select(id){sel=id;drawOverlay();}
function getItem(id){return items.filter(function(i){return i.id===id;})[0];}
function addImage(src,cb){

var drag=null;
$("ov").addEventListener("pointerdown",function(e){
 var el=e.target.closest?e.target.closest(".itm"):null;

/* ---- signature pad ---- */
var pad=$("pad"),pctx=null,strokes=[],curStroke=null,padMode="draw",upData=null;
function setupPad(){
 var dpr=Math.min(window.devicePixelRatio||1,2),w=pad.clientWidth||500,h=Math.round(w*0.38);
 pad.style.height=h+"px";pad.width=Math.round(w*dpr);pad.height=Math.round(h*dpr);
 pctx=pad.getContext("2d");pctx.setTransform(dpr,0,0,dpr,0,0);redrawPad();
}
function redrawPad(){
 if(!pctx)return;
 pctx.clearRect(0,0,pad.width,pad.height);
 pctx.strokeStyle=$("inkc").value;pctx.fillStyle=$("inkc").value;pctx.lineCap="round";pctx.lineJoin="round";
 var bw=parseFloat($("inkw").value);
 strokes.forEach(function(s){
  var pts=s.pts;
  if(pts.length===1){pctx.beginPath();pctx.arc(pts[0].x,pts[0].y,bw/2,0,6.2832);pctx.fill();return;}
  for(var i=1;i<pts.length;i++){
   var a=pts[i-1],b=pts[i],mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
   pctx.lineWidth=bw*(s.pen?(0.5+b.p):1);
   pctx.beginPath();
   if(i===1)pctx.moveTo(a.x,a.y);else pctx.moveTo((pts[i-2].x+a.x)/2,(pts[i-2].y+a.y)/2);
   pctx.quadraticCurveTo(a.x,a.y,mx,my);pctx.stroke();
  }
 });
}
function pp(e){var r=pad.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top,p:e.pressure>0?e.pressure:0.5};}
pad.addEventListener("pointerdown",function(e){curStroke={pen:e.pointerType==="pen",pts:[pp(e)]};strokes.push(curStroke);try{pad.setPointerCapture(e.pointerId);}catch(x){}redrawPad();e.preventDefault();});
pad.addEventListener("pointermove",function(e){if(!curStroke)return;curStroke.pts.push(pp(e));redrawPad();e.preventDefault();});
function padEnd(){curStroke=null;}
pad.addEventListener("pointerup",padEnd);pad.addEventListener("pointercancel",padEnd);
$("inkc").addEventListener("change",redrawPad);$("inkw").addEventListener("change",redrawPad);
$("padUndo").addEventListener("click",function(){strokes.pop();redrawPad();});
$("padClear").addEventListener("click",function(){strokes=[];upData=null;$("upImg").style.display="none";redrawPad();});

 $("padBox").style.display="block";strokes=[];upData=null;$("upImg").style.display="none";setTab("draw");
 setTimeout(function(){setupPad();$("padBox").scrollIntoView({behavior:"smooth",block:"nearest"});},30);
});
function setTab(m){
 padMode=m;$("drawBox").style.display=m==="draw"?"block":"none";$("upBox").style.display=m==="up"?"block":"none";
 $("tabDraw").classList.toggle("on",m==="draw");$("tabUp").classList.toggle("on",m==="up");
 $("padUndo").style.display=m==="draw"?"":"none";

}
$("tabDraw").addEventListener("click",function(){setTab("draw");});
$("tabUp").addEventListener("click",function(){setTab("up");});

function cropCanvas(src){
 var w=src.width,h=src.height,d=src.getContext("2d").getImageData(0,0,w,h).data,x0=w,y0=h,x1=-1,y1=-1,x,y;
 for(y=0;y<h;y++)for(x=0;x<w;x++){if(d[(y*w+x)*4+3]>20){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}}
 if(x1<0)return null;
 var m=Math.round(Math.max(w,h)*0.01);x0=Math.max(0,x0-m);y0=Math.max(0,y0-m);x1=Math.min(w-1,x1+m);y1=Math.min(h-1,y1+m);
 var c=document.createElement("canvas");c.width=x1-x0+1;c.height=y1-y0+1;c.getContext("2d").drawImage(src,x0,y0,c.width,c.height,0,0,c.width,c.height);
 var mx=1000;if(c.width>mx){var r=document.createElement("canvas");r.width=mx;r.height=Math.round(c.height*mx/c.width);r.getContext("2d").drawImage(c,0,0,r.width,r.height);return r;}
 return c;
}
$("fileImg").addEventListener("change",function(){
 var f=this.files[0];this.value="";if(!f)return;
 var u=URL.createObjectURL(f),im=new Image();
 im.onload=function(){
  var s=Math.min(1,1400/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement("canvas");
  c.width=Math.max(1,Math.round(im.naturalWidth*s));c.height=Math.max(1,Math.round(im.naturalHeight*s));
  var x=c.getContext("2d");x.drawImage(im,0,0,c.width,c.height);
  if($("upTrans").checked){
   var id=x.getImageData(0,0,c.width,c.height),d=id.data;
   for(var i=0;i<d.length;i+=4){var l=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];if(l>235)d[i+3]=0;else if(l>185)d[i+3]=Math.round((235-l)/50*d[i+3]);}
   x.putImageData(id,0,0);
  }
  var cr=cropCanvas(c);upData=cr?cr.toDataURL("image/png"):null;
  var pv=$("upImg");if(upData){pv.src=upData;pv.style.display="block";}
  URL.revokeObjectURL(u);
 };
 im.src=u;
});

$("padUse").addEventListener("click",function(){

  if(!strokes.length){show(T[L].errEmptyPad,true);return;}

  if(!upData){show(T[L].errNoImg,true);return;}
  data=upData;
 }
 if(!data){show(T[L].errEmptyPad,true);return;}
 hide();
 if($("remember").checked){var a=getSaved().filter(function(x){return x!==data;});a.unshift(data);setSaved(a.slice(0,4));renderSaved();}

/* ---- export ---- */
function textPng(text,fontUnits,color){
 var k=3,fp=Math.max(8,fontUnits*k),c=document.createElement("canvas"),x=c.getContext("2d");
 var font=fp+'px "Segoe UI",Tahoma,Arial,sans-serif';x.font=font;x.direction=dirOf(text);
 var w=Math.ceil(x.measureText(text).width)+4,h=Math.ceil(fp*1.2);
 c.width=w;c.height=h;x=c.getContext("2d");x.font=font;x.direction=dirOf(text);x.fillStyle=color||"#111";x.textBaseline="middle";x.textAlign=dirOf(text)==="rtl"?"right":"left";
 x.fillText(text,dirOf(text)==="rtl"?w-2:2,h/2+fp*0.04);
 return {url:c.toDataURL("image/png"),w:w/k,h:h/k};
}
function dataToBytes(u){var b=atob(u.split(",")[1]),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
function exportPdf(){
 if(!items.length){show(T[L].errNone,true);return;}
 show(T[L].busy,false);
 ensureLib().then(function(){
  var P=window.PDFLib;
  return P.PDFDocument.load(bytes.slice(0),{ignoreEncryption:true}).then(function(pd){
   var pages=pd.getPages(),cache={},chain=Promise.resolve();
   items.forEach(function(it){
    chain=chain.then(function(){
     var pg=pages[it.page-1];if(!pg)return;
     var rot=((pg.getRotation().angle%360)+360)%360,cb=pg.getCropBox?pg.getCropBox():pg.getMediaBox();
     var W=cb.width,H=cb.height,Wv=rot%180?H:W,Hv=rot%180?W:H;
     var src,w,h;
     if(it.type==="img"){src=it.src;w=it.w*Wv;h=w*it.ar;}
     else{var tp=textPng(it.text,it.size*Wv,it.color);src=tp.url;w=tp.w;h=tp.h;}
     var u0=it.x*Wv,v0=it.y*Hv,x,y;
     if(rot===0){x=u0;y=H-v0-h;}else if(rot===90){x=v0+h;y=u0;}else if(rot===180){x=W-u0;y=v0+h;}else{x=W-v0-h;y=H-u0;}
     var p=cache[src]?Promise.resolve(cache[src]):pd.embedPng(dataToBytes(src)).then(function(im){cache[src]=im;return im;});
     return p.then(function(im){pg.drawImage(im,{x:x+cb.x,y:y+cb.y,width:w,height:h,rotate:P.degrees(rot)});});
    });
   });
   return chain.then(function(){return pd.save();});
  });
 }).then(function(out){
  var u=URL.createObjectURL(new Blob([out],{type:"application/pdf"})),a=document.createElement("a");
  a.href=u;a.download=fileBase+"-signed.pdf";document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(u);},4000);show(T[L].done,false);
 }).catch(function(e){show(e&&e.message==="lib"?T[L].errLib:T[L].errSave,true);});
}
$("dl").addEventListener("click",exportPdf);
