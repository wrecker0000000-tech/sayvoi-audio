var ABBR=/^(Mr|Mrs|Ms|Dr|Prof|Sr|Jr|St|vs|etc|No|Inc|Ltd|Co|Fig|approx|dept|est)$/i;
var END=".!?؟…",CLOSE="\"'”’)]»";
function wc(s){var t=s.trim();return t?t.split(/\s+/).length:0;}
function sents(s){
 var res=[],start=0;
 for(var i=0;i<s.length;i++){
  if(END.indexOf(s[i])<0)continue;
  var j=i;while(j+1<s.length&&END.indexOf(s[j+1])>=0)j++;
  var k=j;while(k+1<s.length&&CLOSE.indexOf(s[k+1])>=0)k++;
  if(k+1<s.length&&!/\s/.test(s[k+1])){i=k;continue;}
  if(s[i]==="."&&j===i){var m=/([A-Za-z]+)$/.exec(s.slice(0,i));var w=m?m[1]:"";if(w&&(ABBR.test(w)||(w.length===1&&/[A-Z]/.test(w)))){i=k;continue;}}
  var piece=s.slice(start,k+1).trim();if(piece)res.push(piece);start=k+1;i=k;
 }
 var t=s.slice(start).trim();if(t)res.push(t);
 return res;
}
function brk(s,max){
 var w=s.split(/\s+/);if(w.length<=max)return[s];
 var half=w.length/2,best=-1,bd=1e9;
 for(var i=1;i<w.length;i++){if(/[،,;؛:]$/.test(w[i-1])&&i>=2&&w.length-i>=2){var d=Math.abs(i-half);if(d<bd){bd=d;best=i;}}}
 if(best<0)best=Math.ceil(half);
 return brk(w.slice(0,best).join(" "),max).concat(brk(w.slice(best).join(" "),max));
}
function key(s){return s.toLowerCase().replace(/[\s.,!?؟،؛;:…"'”’“()\[\]«»\-–—]+/g,"");}
function split(txt,o){
 txt=txt.replace(/\r/g,"").replace(/\uFEFF/g,"");
 var lines=o.mode==="punct"?[txt.replace(/\n+/g," ")]:txt.split("\n"),out=[];
 lines.forEach(function(l){
  l=l.trim();if(!l)return;
  if(o.mark)l=l.replace(/^\s*(?:[-*•–—]+|\(?[0-9٠-٩]+[.)\-:])\s+/,"");
  if(!l)return;
  if(o.mode==="lines")out.push(l);else out=out.concat(sents(l));
 });
 if(o.min>0){var m=[];for(var i=0;i<out.length;i++){var c=out[i];
  while(wc(c)<o.min&&i+1<out.length){i++;c+=" "+out[i];}
  if(wc(c)<o.min&&m.length)m[m.length-1]+=" "+c;else m.push(c);}out=m;}
 if(o.max>0){var b=[];out.forEach(function(s){b=b.concat(brk(s,o.max));});out=b;}
 var drop=0;
 if(o.dup){var seen={},d=[];out.forEach(function(s){var k=key(s);if(!k||seen[k]){drop++;return;}seen[k]=1;d.push(s);});out=d;}
 return{list:out,drop:drop};
}
function opts(){return{mode:$("mode").value,max:+$("maxw").value,min:+$("minw").value,dup:$("dup").value==="1",mark:$("mark").value==="1"};}
function run(){
 var t=T[L],inp=$("inp").value;

 var o=opts(),r=split(inp,o),n=$("num").value,list=r.list,pad=String(list.length).length;
 var lines=list.map(function(s,i){if(n==="none")return s;var x=String(i+1);if(n==="001")while(x.length<Math.max(3,pad))x="0"+x;return x+". "+s;});
 $("outp").value=lines.join("\n");

 if(over)st+=" · "+t.stOver+": "+over;
 $("stats").textContent=st;
}
