    <div class="tools"><button type="button" class="b sec" id="mic"></button></div>
  </div>

<div id="sBox2" style="display:none">

  <details id="rv">
   <summary data-i="sRev"></summary>
   <div class="row" style="margin-top:0"><div class="col" style="max-width:240px"><select id="sFilter"><option value="all" data-k="fAll"></option><option value="todo" data-k="fTodo"></option><option value="done" data-k="fDone"></option></select></div></div>
   <div id="sList"></div>

  for(var q=takes.length-1;q>=0;q--){if(takes[q].sid===sid){URL.revokeObjectURL(takes[q].url);if(takes[q].id)dbDel(takes[q].id);takes.splice(q,1);}}}
 else sid=null;
 var t={blob:blob,ext:ext,base:sid!==null?scriptName(sid):nextName(),sid:sid,url:URL.createObjectURL(blob),stats:stats,created:Date.now()};
 takes.push(t);
 takes.sort(function(a,b){var x=a.sid===null?1e9:a.sid,y=b.sid===null?1e9:b.sid;return x!==y?x-y:a.created-b.created;});
 renderTakes();showSentence();
 var id=await dbPut(t);if(id)t.id=id;
 try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
 showStore();}
function statLine(t){
 var s=t.stats,x=[T[L].dur+": "+fmtT(s.dur*1000)];
 if(s.rate)x.push((s.rate/1000)+" kHz · "+(s.ch===1?T[L].mono:T[L].stereo)+" · "+s.bits+"-bit");
 if(s.peak!==undefined)x.push(T[L].peak+": "+dB(s.peak).toFixed(1)+" dBFS · "+T[L].avg+": "+dB(s.rms).toFixed(1)+" dBFS");
 if(t.sid!==null&&t.sid!==undefined&&script[t.sid])x.push("“"+script[t.sid].t.slice(0,50)+(script[t.sid].t.length>50?"…":"")+"”");
 return x.join(" · ");}

  var inp=document.createElement("input");inp.type="text";inp.value=t.base;inp.setAttribute("dir","ltr");inp.setAttribute("data-r",i);d.appendChild(inp);
  var ex=document.createElement("span");ex.textContent="."+t.ext;ex.style.direction="ltr";d.appendChild(ex);
  var b1=document.createElement("button");b1.type="button";b1.className="b";b1.textContent=T[L].dl;b1.setAttribute("data-d",i);d.appendChild(b1);
  var b2=document.createElement("button");b2.type="button";b2.className="b sec";b2.textContent=T[L].del;b2.setAttribute("data-x",i);d.appendChild(b2);
  var sm=document.createElement("small");sm.textContent=statLine(t);d.appendChild(sm);
  var warn=[];if(t.stats.clipped>0)warn.push(T[L].clip);else if(t.stats.peak!==undefined&&dB(t.stats.peak)<-30)warn.push(T[L].low);
  if(warn.length){var w=document.createElement("small");w.className="flag";w.textContent=warn.join(" ");d.appendChild(w);}
  box.appendChild(d);});

function parseScript(text){
 var lines=text.replace(/^\uFEFF/,"").split(/\r\n|\n|\r/),items=[];
 lines.forEach(function(l){
  if(!l.trim())return;
  var c=l.split("\t"),id=null,t,n="",m=/^\s*(\d+)\s*[.:)\-]\s*(.+)$/.exec(c[0]);
  if(c.length>=2&&/^\s*\d+\s*$/.test(c[0])){id=parseInt(c[0],10);t=c[1].trim();n=(c[2]||"").trim();}
  else if(m){id=parseInt(m[1],10);t=m[2].trim();n=c.slice(1).join(" ").trim();}
  else{t=c[0].trim();n=c.slice(1).join(" ").trim();}
  if(t)items.push({id:id,t:t,n:n});});
 var st=parseInt($("start").value,10);if(isNaN(st))st=1;
 items.forEach(function(it,i){if(it.id===null)it.id=st+i;});
 return items;}
